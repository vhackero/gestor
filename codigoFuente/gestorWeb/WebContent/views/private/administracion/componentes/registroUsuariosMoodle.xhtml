<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets"
 xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core" xmlns:p="http://primefaces.org/ui">
 <div class="registro-usuarios-moodle">
  <p:panel id="panelRegistroMoodle" header="#{sistema.obtenerTexto('gw.registroMoodle.titulo')}">
   <p><h:outputText value="#{sistema.obtenerTexto('gw.registroMoodle.ayuda')}"/></p>
   <div class="row">
    <div class="col-md-4"><p:outputLabel for="plataformaRegistroMoodle" value="#{sistema.obtenerTexto('gw.registroMoodle.plataforma')}"/>
     <p:selectOneMenu id="plataformaRegistroMoodle" value="#{registroUsuariosMoodleBean.plataforma}" required="true" requiredMessage="#{sistema.obtenerTexto('gw.registroMoodle.plataformaRequerida')}" disabled="#{registroUsuariosMoodleBean.enCurso}" style="width:100%">
      <f:selectItem itemLabel="#{sistema.obtenerTexto('gw.registroMoodle.seleccionar')}" itemValue="#{null}" noSelectionOption="true"/>
      <f:selectItems value="#{registroUsuariosMoodleBean.plataformas}" var="opcion" itemValue="#{opcion[0]}" itemLabel="#{opcion[1]}"/>
      <p:ajax process="@this" update="botonRegistroMoodle"/>
     </p:selectOneMenu>
    </div>
    <div class="col-md-4"><p:outputLabel id="labelPlanRegistroMoodle" for="planRegistroMoodle" value="#{sistema.obtenerTexto('gw.registroMoodle.plan')}"/>
     <p:selectOneMenu id="planRegistroMoodle" value="#{registroUsuariosMoodleBean.plan}" disabled="#{registroUsuariosMoodleBean.enCurso}" required="#{not empty registroUsuariosMoodleBean.nombreUsuario}" requiredMessage="#{sistema.obtenerTexto('gw.registroMoodle.planRequeridoUsuario')}" style="width:100%">
      <f:selectItem itemLabel="#{sistema.obtenerTexto('gw.registroMoodle.todosPlanes')}" itemValue="#{null}"/>
      <f:selectItems value="#{registroUsuariosMoodleBean.planes}" var="opcion" itemValue="#{opcion[0]}" itemLabel="#{opcion[1]}"/>
     </p:selectOneMenu>
    </div>
    <div class="col-md-4"><p:outputLabel for="usuarioRegistroMoodle" value="#{sistema.obtenerTexto('gw.registroMoodle.nombreUsuario')}"/>
     <p:inputText id="usuarioRegistroMoodle" value="#{registroUsuariosMoodleBean.nombreUsuario}" maxlength="100" disabled="#{registroUsuariosMoodleBean.enCurso}" style="width:100%">
      <p:ajax event="change" process="@this" update="planRegistroMoodle labelPlanRegistroMoodle"/>
     </p:inputText>
    </div>
   </div>
   <div class="registro-moodle-acciones"><p:commandButton id="botonRegistroMoodle" value="#{sistema.obtenerTexto('gw.registroMoodle.registrar')}" action="#{registroUsuariosMoodleBean.registrar}"
    disabled="#{registroUsuariosMoodleBean.registrarDeshabilitado}" process="panelRegistroMoodle" update="panelRegistroMoodle" styleClass="btn btn-primary"/></div>
   <p:messages showDetail="false"/>
   <h:panelGroup rendered="#{not empty registroUsuariosMoodleBean.estado}" layout="block" styleClass="registro-moodle-progreso">
    <p:progressBar value="#{registroUsuariosMoodleBean.estado.porcentaje}" labelTemplate="{value}%"/>
    <p><h:outputText value="#{registroUsuariosMoodleBean.resumen}"/></p>
    <p><h:outputText value="#{registroUsuariosMoodleBean.errorGeneral}"/></p>
    <h:panelGroup rendered="#{not empty registroUsuariosMoodleBean.errores}" layout="block">
     <p><h:outputText value="#{sistema.obtenerTexto('gw.registroMoodle.erroresAyuda')}"/></p>
     <ul><ui:repeat value="#{registroUsuariosMoodleBean.errores}" var="error"><li><h:outputText value="#{error}"/></li></ui:repeat></ul>
    </h:panelGroup>
    <p:poll interval="3" global="false" process="@this" update="panelRegistroMoodle" stop="#{registroUsuariosMoodleBean.estado.terminado}"/>
   </h:panelGroup>
  </p:panel>
 </div>
</ui:composition>
