<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:sec="http://www.springframework.org/security/tags">
	<ui:define name="breadcrumb">
si		<li>#{sistema.obtenerTexto('gw.analisis.titulo')}</li>
		<li class="active">#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.titulo')}</li>
	</ui:define>
	<ui:define name="content">
		<h1>#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.titulo')}</h1>
		<hr />
		<p:ajaxStatus onstart="PF('dialogLayout').show()"
			onsuccess="PF('dialogLayout').hide()" />
		<h:form id="form">
			<f:validateBean disabled="true">
				<div class="row">
					<div class="col-md-12">
						<p:panel header="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.busqueda.titulo')}">
							<div class="form-group">
								<div class="row">
									<div class="col-md-3">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.clasificacion')}"
											for="selClasificacion" styleClass="bloque" />
										<p:selectOneMenu id="selClasificacion" styleClass="col-xs-12"
											value="#{reporteUsuariosBean.criterios.persona.tipoUsuario}">
											<f:selectItem noSelectionOption="true"
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems value="#{reporteUsuariosBean.tiposUsuario()}"
												var="tipoU" itemLabel="#{tipoU.descripcion}"
												itemValue="#{tipoU.valor}" />
										</p:selectOneMenu>
									</div>

									<div class="col-md-3">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.estatus')}" for="selEstatus"
											styleClass="bloque" />
										<p:selectOneMenu id="selEstatus" styleClass="col-xs-12"
											value="#{reporteUsuariosBean.criterios.persona.activo}">
											<f:selectItem noSelectionOption="true"
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems
												value="#{reporteUsuariosBean.estatusPersona()}"
												var="estatus" itemLabel="#{estatus.descripcion}"
												itemValue="#{estatus.valor}" />
										</p:selectOneMenu>
									</div>

									<div class="col-md-6">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.estado')}" for="selEstado"
											styleClass="bloque" />
										<p:selectOneMenu id="selEstado" styleClass="col-xs-12"
											value="#{reporteUsuariosBean.criterios.idEntidadFederativa}"
											valueChangeListener="#{reporteUsuariosBean.onEstadoChange}">
											<p:ajax update="selCiudad" />
											<f:selectItem noSelectionOption="true"
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems
												value="#{reporteUsuariosBean.entidadesFederativas}"
												var="entidad" itemLabel="#{entidad.nombre}"
												itemValue="#{entidad.id}" />
										</p:selectOneMenu>
									</div>
								</div>
							</div>
							<div class="form-group">
								<div class="row">
									<div class="col-md-3">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.ciudad')}" for="selCiudad"
											styleClass="bloque" />

										<p:selectOneMenu id="selCiudad" styleClass="col-xs-12"
											disabled="#{reporteUsuariosBean.criterios.idEntidadFederativa == 0}"
											value="#{reporteUsuariosBean.criterios.idMunicipio}">
											<f:selectItem noSelectionOption="true"
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems value="#{reporteUsuariosBean.municipios}"
												var="municipio" itemLabel="#{municipio.nombre}"
												itemValue="#{municipio.idMunicipio}" />
										</p:selectOneMenu>

									</div>

									<div class="col-md-3">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.genero')}" for="selGenero"
											styleClass="bloque" />
										<p:selectOneMenu id="selGenero" styleClass="col-xs-12"
											value="#{reporteUsuariosBean.criterios.persona.genero}">
											<f:selectItem noSelectionOption="true"
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems value="#{reporteUsuariosBean.generos()}"
												var="genero" itemLabel="#{genero.descripcion}"
												itemValue="#{genero.valor}" />
										</p:selectOneMenu>
									</div>
									<div class="col-md-6">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.rangoEdad')}" for="rangoEdad"
											styleClass="bloque" />
										<p:selectOneMenu id="rangoEdad" styleClass="col-xs-12"
											value="#{reporteUsuariosBean.seleccionRangoEdad}">
											<f:selectItem noSelectionOption="true"
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems value="#{reporteUsuariosBean.rangoEdades}" />
										</p:selectOneMenu>
									</div>
								</div>
							</div>
							<div class="form-group">
								<div class="row">
									<div class="col-md-4">
										<f:validateBean disabled="true">
											<p:outputLabel
												value="#{sistema.obtenerTexto('gw.ga.label.rangofechas')}:" />
											<p:selectOneMenu id="tipofecha" required="false"
												value="#{reporteUsuariosBean.tipoDatoFechas}"
												autoWidth="false" styleClass="col-xs-12">
												<p:ajax update="fc_fechaInicial fc_fechaFinal" />
												<f:selectItem
													itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
													itemValue="#{null}" />
												<f:selectItem
													itemLabel="#{sistema.obtenerTexto('gw.ga.label.ite')}"
													itemValue="#{1}" />
												<f:selectItem
													itemLabel="#{sistema.obtenerTexto('gw.ga.label.ie')}"
													itemValue="#{2}" />
												<f:selectItem
													itemLabel="#{sistema.obtenerTexto('gw.ga.label.te')}"
													itemValue="#{3}" />
											</p:selectOneMenu>
										</f:validateBean>
									</div>
									<div class="col-md-6">

										<div class="row">
											<div class="col-md-6">
												<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.fechaInicial')}" styleClass="bloque" />
												<p:calendar id="fc_fechaInicial" styleClass="requerido"
													pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}"
													yearRange="c-100:c+100" locale="es" navigator="true"
													placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
													showOn="button" readonlyInput="true"
													disabled="#{reporteUsuariosBean.tipoDatoFechas == null}"
													value="#{reporteUsuariosBean.criterios.persona.fechaInicial}">
													<p:ajax update="fc_fechaFinal" />
												</p:calendar>

											</div>

											<div class="col-md-6">
												<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.fechaFinal')}" styleClass="bloque" />
												<p:calendar id="fc_fechaFinal" styleClass="requerido"
													pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}"
													yearRange="c-100:c+100" locale="es" navigator="true"
													placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
													showOn="button" readonlyInput="true"
													disabled="#{reporteUsuariosBean.tipoDatoFechas == null}"
													value="#{reporteUsuariosBean.criterios.persona.fechaFinal}" />
											</div>
										</div>
									</div>

								</div>

							</div>
							<!-- 				Buscar usuarios -->
							<div class="row">
								<div class="col-md-12 text-right">
									<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.limpiar')}"
										actionListener="#{reporteUsuariosBean.limpiarCampos}"
										ajax="true" update="@form" styleClass="btn btn-default" />
									<p:commandButton styleClass="btn btn-primary" value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.buscar')}"
										update="@form"
										action="#{reporteUsuariosBean.buscaUsuariosCriterios}"
										ajax="true" />
								</div>
							</div>
						</p:panel>
					</div>
				</div>

			</f:validateBean>
			<div class="row">
				<div class="col-md-12">
					<p:panel header="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.resultado')}">
						<p:dataTable value="#{reporteUsuariosBean.tblDatosPersona}"
							reflow="true"
							emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.sinRegistros')}"
							tableStyleClass="table" id="tblPersonas" var="datosPer"
							paginator="true" paginatorPosition="bottom" rows="10"
							paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks}
								 {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
							currentPageReportTemplate="({currentPage} de {totalPages})"
							rowsPerPageTemplate="5,10,15">

							<f:facet name="header">
								<div class="row flexY">
									<div class="col-md-8">
										<p:outputLabel
											value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.instruccion')}" />
									</div>
									<div class="col-md-4">
										<p:commandButton id="toggler" type="button"
											value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.columnaDatos')}" style="width:200px"
											styleClass="pull-right btn btn-default"
											icon="ui-icon-carat-1-s" />
										<p:columnToggler id="columnaSelectora"
											datasource="tblPersonas" trigger="toggler">
											<p:ajax event="toggle"
												listener="#{reporteUsuariosBean.onToggle}" />
										</p:columnToggler>
									</div>
								</div>
							</f:facet>

							<!-- Datos persona -->
							<p:column visible="#{reporteUsuariosBean.visible[0]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.estatus')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.domicilioPersona.persona.activo ? sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.activo') : sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.inactivo')}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[1]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.clasificacion')}" />
								</f:facet>

								<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.externo')}"
									rendered="#{datosPer.domicilioPersona.persona.tipoUsuario eq 2}" />
								<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.interno')}"
									rendered="#{datosPer.domicilioPersona.persona.tipoUsuario eq 1}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[2]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.nombre')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.domicilioPersona.persona.nombre}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[3]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.apellidoPaterno')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.domicilioPersona.persona.apellidoPaterno}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[4]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.apellidoMaterno')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.domicilioPersona.persona.apellidoMaterno}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[5]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.fechaRegistro')}" />
								</f:facet>

								<h:outputText value="#{datosPer.fechaRegistro()}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[6]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.entidad')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.domicilioPersona.asentamiento.municipio.entidadFederativa.nombre}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[7]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.genero')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.domicilioPersona.persona.genero}" />
							</p:column>



							<!-- 					Datos laborales -->
							<p:column visible="#{reporteUsuariosBean.visible[8]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.institucion')}" />
								</f:facet>

								<h:outputText value="#{datosPer.datosLaborales.institucion}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[9]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.unidadAdscripcion')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.datosLaborales.unidadAdscripcion}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[10]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.areaAdscripcion')}" />
								</f:facet>

								<h:outputText value="#{datosPer.datosLaborales.areaAdscripcion}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[11]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.programaSocial')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.datosLaborales.programaSocial ? sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.si') : sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.no')}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[12]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.puesto')}" />
								</f:facet>

								<h:outputText value="#{datosPer.datosLaborales.puesto}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[13]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.ordenGobierno')}" />
								</f:facet>

								<h:outputText value="#{reporteUsuariosBean.obtenerNombreOrdenPorId(datosPer.datosLaborales.idOrdenGobierno)}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[14]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.roles')}" />
								</f:facet>

								<h:outputText value="#{datosPer.roles()}" />
							</p:column>

							<p:column visible="#{reporteUsuariosBean.visible[15]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.edad')}" />
								</f:facet>

								<h:outputText
									value="#{datosPer.domicilioPersona.persona.edad()}" />
							</p:column>

							

						</p:dataTable>
					</p:panel>
				</div>
			</div>

			<div class="form-group">
				<div class="row">
					<div class="col-md-12 floatFlexCentrarY margenInferior">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.reporteExcel')}" style="margin-bottom:0"
								styleClass="margenDerecho agregaHeight" for="btnReporte" />
							<p:commandButton id="btnReporte" value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.descargar')}"
								disabled="#{reporteUsuariosBean.tblDatosPersona.isEmpty()}"
								style="margin-left:0; margin-right:10px"
								styleClass="btn btn-primary" ajax="false">
							<p:dataExporter type="xls" target="tblPersonas"
								fileName="analisisDatosUsuarios" pageOnly="false" />
						</p:commandButton>

							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.informePredisenado')}"
								style="margin-bottom:0" styleClass="margenDerecho" />


							<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.generar')}"
								disabled="#{reporteUsuariosBean.tblDatosPersona.isEmpty()}"
								onclick="graficasUsuarios();"
								styleClass="btn btn-primary margenDerecho quitaMargen" />

						<p:remoteCommand name="graficasUsuarios"
							action="#{reporteUsuariosBean.generaEstadisticas}" update="@form"
							oncomplete="cargaGraficasUsuarios(xhr, status, args); PF('modalAnalisis').show(); scrollArribaUsuarios()" />

						<p:remoteCommand name="scrollArribaUsuarios"
							action="#{reporteUsuariosBean.scrollArriba}" />



					</div>
				</div>
			</div>


			<p:dialog widgetVar="modalAnalisis" modal="true" resizable="false"
				id="modalInformeUsuarios" draggable="false" closable="false"
				position="center" width="900" 
				styleClass="modalAnalisisDatos modalAbsoluto"
					header="#{reporteUsuariosBean.renderizarEstado ? sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.titulo.estado') : sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.titulo.general')}">
				<div class="row">
					<div class="col-md-12" style="text-align: right">
						<p:outputPanel layout="block"
							rendered="#{((reporteUsuariosBean.criterios.persona.fechaInicial != null) and (reporteUsuariosBean.criterios.persona.fechaFinal != null))}">

								<p:outputLabel
									value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.registroUsuarios')} #{reporteUsuariosBean.tipoDatoFecha(reporteUsuariosBean.tipoDatoFechas)}"
									styleClass="labelSuperior labelRangoFechas bloque"
									style="margin:0" />
							<p:outputLabel />

							<p:outputLabel
								value="#{reporteUsuariosBean.criterios.persona.fechaInicial}"
								styleClass="labelSuperior labelFecha">
								<f:convertDateTime type="date"
									pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}" />
							</p:outputLabel>
								<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.y')}" style="margin-left:5px; margin-right:5px"
									styleClass="labelSuperior labelFecha" />
							<p:outputLabel
								value="#{reporteUsuariosBean.criterios.persona.fechaFinal}"
								styleClass="labelSuperior labelFecha">
								<f:convertDateTime type="date"
									pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}" />
							</p:outputLabel>
						</p:outputPanel>
					</div>
				</div>

				<p:outputPanel layout="block"
					rendered="#{reporteUsuariosBean.renderizarEstado}">
					<div class="row">
						<div class="col-md-4">
								<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.entidad')}"
									styleClass="bloque labelSuperior" />
							<p:outputLabel value="#{reporteUsuariosBean.nombreEntidad}"
								styleClass="bloque numeroGrande gEntidad" />

						</div>
						<div class="col-md-8">
							<p:outputPanel layout="block"
								rendered="#{reporteUsuariosBean.renderizarMunicipio}">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.municipio')}"
										styleClass="bloque labelSuperior" />
								<p:outputLabel value="#{reporteUsuariosBean.nombreMunicipio}"
									styleClass="bloque numeroGrande gMunicipio" />
							</p:outputPanel>
						</div>
					</div>
				</p:outputPanel>

				<div class="row">

					<!-- CABECERA TOTAL USUARIOS -->
					<div class="col-md-3 text-center fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.total')}" styleClass="bloque labelSuperior" />
							<p:outputLabel value=""
								styleClass="bloque numeroGrande gTotalUsuarios" />
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.titulo')}" styleClass="bloque labelInferior" />
					</div>

					<!-- CABECERA TIPO DE USUARIO EXTERNO -->
					<div class="col-md-3 text-center fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.tiposUsuarios')}"
								styleClass="bloque labelSuperior" />
						<p:outputLabel value=""
							styleClass="bloque numeroGrande gTotal#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.externo')}s" />
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.externo')}s" styleClass="bloque labelInferior" />
					</div>

					<!-- CABECERA TIPO DE USUARIO INTERNO -->

					<div class="col-md-3 text-center fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.tiposUsuarios')}"
								styleClass="bloque labelSuperior" />
						<p:outputLabel value=""
							styleClass="bloque numeroGrande gTotal#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.interno')}s" />
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.interno')}s" styleClass="bloque labelInferior" />
					</div>

					<!-- CABECERA USUARIOS EN LINEA -->

					<div class="col-md-3 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.enLinea')}" styleClass="bloque labelSuperior" />
						<div class="centrarHorizontal">
							<p:outputPanel layout="block" styleClass="c100 p#{reporteUsuariosBean.obtenerPorcentajeUsuariosEnLinea()} small">
								<span>#{reporteUsuariosBean.obtenerPorcentajeUsuariosEnLinea()}%</span>
								<div class="slice">
									<div class="bar"></div>
									<div class="fill"></div>
								</div>

							</p:outputPanel>
						</div>

						<p:outputLabel
							value="#{reporteUsuariosBean.obtenerUsuariosEnLinea()}"
							styleClass="bloque numeroGrande text-center"
							style="margin-bottom:0" />
							<p:outputLabel
								value="#{reporteUsuariosBean.obtenerUsuariosEnLinea() == 1 ? sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.activo') : sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.activos')}"
								styleClass="bloque labelInferior text-center"
								style="margin-bottom:0" />

					</div>
				</div>
				<div class="row">
					<!-- GRAFICA USUARIOS POR #{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.genero')} -->
					<div class="col-md-6 fondoGris">
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.genero')}"
							styleClass="bloque text-center labelSuperior" />
						<div id="datosUsuariosGeneros" class="medidaGrafica"></div>
					</div>
					<!-- GRAFICA USUARIOS POR #{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.estatus')} -->
					<div class="col-md-6 fondoGris">
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.estatusUsuarios')}"
							styleClass="bloque text-center labelSuperior" />
						<div id="datosUsuarios#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.estatus')}" class="medidaGrafica"></div>
					</div>
				</div>

				<div class="row">
					<!-- GRAFICA #{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.ordenGobierno')} -->
					<div class="col-md-offset-3 col-md-6 fondoGris">
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.ordenGobierno')}"
							styleClass="bloque text-center labelSuperior" />
						<div id="datosUsuariosOrdenGobierno" class="medidaGrafica"></div>
					</div>
					<!-- GRAFICA #{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.puesto')} -->
					<div class="col-md-6 fondoGris" style="display:none">
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.puesto')}"
							styleClass="bloque text-center labelSuperior" />
						<div id="datosUsuariosPuesto" class="medidaGrafica"></div>
					</div>
				</div>
				<div class="row">
					<div class="col-md-12 fondoGris">
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.rangoEdades')}"
							styleClass="bloque text-center tituloSuperior" />
						<div id="rangoEdades"></div>
					</div>
				</div>
				<p:panel rendered="true">
					<div class="row">
						<div class="col-md-6 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.nivelConocimientos')}"
								styleClass="bloque text-center labelSuperior" />
							<div id="nivelDeConocimiento" class="medidaGrafica"></div>
						</div>
						<div class="col-md-6 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.nivelEnsenanza')}"
								styleClass="bloque text-center labelSuperior" />
							<div id="nivelDeEnsenanza" class="medidaGrafica"></div>
						</div>
					</div>

					<div class="row">
						<div class="col-md-6 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.graf.modalidad')}"
								styleClass="bloque text-center labelSuperior" />
							<div id="modalidad" class="medidaGrafica"></div>
						</div>
						<div class="col-md-6 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.col.estatus')}"
								styleClass="bloque text-center labelSuperior" />
							<div id="estatus" class="medidaGrafica"></div>
						</div>
					</div>

				</p:panel>

				<f:facet name="footer">
					<div class="row">
						<div class="col-md-12">
							<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.cerrar')}"
								onclick="PF('modalAnalisis').hide();"
								styleClass="btn btn-default pull-right" />
						</div>
					</div>
				</f:facet>

			</p:dialog>

		</h:form>
	</ui:define>
</ui:composition>
