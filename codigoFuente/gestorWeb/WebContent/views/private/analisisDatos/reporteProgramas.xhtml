<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:sec="http://www.springframework.org/security/tags">
	<ui:define name="breadcrumb">
		<li>#{sistema.obtenerTexto('gw.analisis.titulo')}</li>
		<li class="active">#{sistema.obtenerTexto('gw.analisis.reporteProgramas.titulo')}</li>
	</ui:define>
	<ui:define name="content">
		<h1>#{sistema.obtenerTexto('gw.analisis.reporteProgramas.titulo')}</h1>
		<hr />
		<p:ajaxStatus onstart="PF('dialogLayout').show()"
			onsuccess="PF('dialogLayout').hide()" />
		<h:form id="form">
			<f:validateBean disabled="true">
				<div class="row">
					<div class="col-md-12">
						<p:panel header="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.busqueda.titulo')}"
							id="pnlBusqueda">
							<div class="form-group">
								<div class="row">
									<div class="col-md-6">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteGestion.entidad')}" styleClass="bloque" />
										<p:selectOneMenu id="selectEntidad" styleClass="col-xs-12"
											value="#{reporteGestionEscolarBean.filtros.idEntidadFederativa}"
											valueChangeListener="#{reporteGestionEscolarBean.onEstadoChange}">
											<p:ajax update="selectMunicipio" />
											<f:selectItem itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" itemValue="#{null}" />
											<f:selectItems
												value="#{reporteGestionEscolarBean.listaEntidades}"
												var="entidad" itemLabel="#{entidad.nombre}"
												itemValue="#{entidad.idEntidadFederativa}" />

										</p:selectOneMenu>
									</div>

									<div class="col-md-6">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteGestion.municipio')}" styleClass="bloque" />
										<p:selectOneMenu id="selectMunicipio" styleClass="col-xs-12"
											disabled="#{reporteGestionEscolarBean.filtros.idEntidadFederativa == NULL}"
											value="#{reporteGestionEscolarBean.filtros.idMunicipio}">
											<f:selectItem itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" itemValue="#{null}" />
											<f:selectItems
												value="#{reporteGestionEscolarBean.listaMunicipios}"
												var="municipio" itemLabel="#{municipio.nombre}"
												itemValue="#{municipio.idMunicipio}" />
										</p:selectOneMenu>
									</div>
								</div>
							</div>
							<div class="form-group">
								<div class="row">
									<div class="col-md-4">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.tipoCompetencia')}"
											styleClass="bloque" />
										<p:selectOneMenu styleClass="col-xs-12"
											valueChangeListener="#{eventoCapacitacionBean.onChangeTpoCompetencia}"
											value="#{reporteGestionEscolarBean.filtros.fichaDescriptivaPrograma.tipoCompetencia}">
											<p:ajax update="selectEjeCapacitacion" />
											<f:selectItem itemValue="#{null}" itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems
												value="#{reporteGestionEscolarBean.listaTiposCompetencias}"
												var="competencia" itemLabel="#{competencia.nombre}"
												itemValue="#{competencia.id}" />
										</p:selectOneMenu>
									</div>
									<div class="col-md-4">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.ejeCapacitacion')}"
											styleClass="bloque" />
										<p:selectOneMenu id="selectEjeCapacitacion"
											styleClass="col-xs-12"
											disabled="#{reporteGestionEscolarBean.filtros.fichaDescriptivaPrograma.tipoCompetencia == null}"
											value="#{reporteGestionEscolarBean.filtros.fichaDescriptivaPrograma.ejeCapacitacion}">
											<p:ajax event="change" process="@this" />
											<f:selectItem itemValue="#{null}"
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems
												value="#{eventoCapacitacionBean.listaEjesCapacitacion}"
												var="ejeCap" itemValue="#{ejeCap.id}"
												itemLabel="#{ejeCap.nombre}" />
										</p:selectOneMenu>
									</div>
									<div class="col-md-4">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modalidad')}" styleClass="bloque" />
										<p:selectOneMenu styleClass="col-xs-12"
											converter="entityConverter"
											value="#{reporteGestionEscolarBean.filtros.catModalidadPlanPrograma}">
											<p:ajax event="change" process="@this" />
											<f:selectItem itemValue="#{null}"
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems
												value="#{reporteGestionEscolarBean.listaModalidadesPrograma}"
												var="modalidad" itemLabel="#{modalidad.nombre}"
												itemValue="#{modalidad}" />
										</p:selectOneMenu>
									</div>
								</div>
							</div>
							<div class="form-group">
								<div class="row">
									<div class="col-md-6">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.nivelEnsenanza')}"
											styleClass="bloque" />
										<p:inputText
											value="#{reporteGestionEscolarBean.filtros.nombreEc}"
											styleClass="form-control" />
									</div>
									<div class="col-md-3">
										<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.estatus')}"
											styleClass="bloque" />
										<p:selectOneMenu styleClass="col-xs-12"
											value="#{reporteGestionEscolarBean.filtros.privado}">
											<f:selectItem itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" itemValue="#{null}" />
											<f:selectItem itemLabel="#{sistema.obtenerTexto('gw.analisis.reporteGestion.valorPrivado')}" itemValue="#{false}" />
											<f:selectItem itemLabel="#{sistema.obtenerTexto('gw.analisis.reporteGestion.valorPublico')}" itemValue="#{true}" />

										</p:selectOneMenu>
									</div>
									
								</div>
							</div>
							<div class="form-group">
								<div class="row">
									<div class="col-md-12 text-right">
										<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.limpiar')}"
											actionListener="#{reporteGestionEscolarBean.limpiarCampos}"
											ajax="true" update="@form" styleClass="btn btn-default" />
										<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.buscar')}" styleClass="btn btn-primary"
											update="@form" ajax="true"
											action="#{reporteGestionEscolarBean.buscarEventosCapacitacion}" />
									</div>
								</div>
							</div>
						</p:panel>

					</div>
				</div>
			</f:validateBean>



			<div class="row">
				<div class="col-md-12">
					<p:panel header="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.resultado')}">



						<p:dataTable
							value="#{reporteGestionEscolarBean.eventosCapacitacion}"
							reflow="true"
							emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.sinRegistros')}"
							tableStyleClass="table" id="tblProgramas" var="evento"
							paginator="true" paginatorPosition="bottom" rows="10"
							paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks}
								 {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
							currentPageReportTemplate="({currentPage} de {totalPages})"
							rowsPerPageTemplate="5,10,15">

							<f:facet name="header">
								<div class="row flexY">
									<div class="col-md-8">
										<p:outputLabel
											value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.instruccion')}" />
									</div>
									<div class="col-md-4">
										<p:commandButton id="toggler" type="button"
											value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.columnaDatos')}" style="width:200px"
											styleClass="pull-right btn btn-default"
											icon="ui-icon-carat-1-s" />
										<p:columnToggler id="columnaSelectora"
											datasource="tblProgramas" trigger="toggler">
											<p:ajax event="toggle"
												listener="#{reporteGestionEscolarBean.onToggle}" />
										</p:columnToggler>
									</div>
								</div>
							</f:facet>
							<p:column visible="#{reporteGestionEscolarBean.visible[0]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.columnas.clave')}" />
								</f:facet>

								<h:outputText value="#{evento.cveEventoCap}" />
							</p:column>
							<p:column visible="#{reporteGestionEscolarBean.visible[1]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.columnas.nombrePrograma')}" />
								</f:facet>

								<h:outputText value="#{evento.nombreEc}" />
							</p:column>
							<p:column visible="#{reporteGestionEscolarBean.visible[2]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.col.ejeCompetencia')}" />
								</f:facet>

								<h:outputText
									value="#{reporteGestionEscolarBean.obtieneNombreTpoCompetencia(evento.fichaDescriptivaPrograma.tipoCompetencia)}" />
							</p:column>
							<p:column visible="#{reporteGestionEscolarBean.visible[3]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.columnas.tipoCompetencia')}" />
								</f:facet>

								<h:outputText
									value="#{reporteGestionEscolarBean.obtieneNombreEjeCapacit(evento.fichaDescriptivaPrograma.ejeCapacitacion)}" />
							</p:column>
							<p:column visible="#{reporteGestionEscolarBean.visible[4]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.col.competenciaEspecifica')}" />
								</f:facet>

								<h:outputText value="#{evento.catModalidadPlanPrograma.nombre}" />
							</p:column>
							<p:column visible="#{reporteGestionEscolarBean.visible[5]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.columnas.modalidad')}" />
								</f:facet>

								<h:outputText
									value="#{evento.catEstadoEventoCapacitacion.nombre}" />
							</p:column>
							<p:column visible="#{reporteGestionEscolarBean.visible[6]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.columnas.estatus')}" />
								</f:facet>
								<h:outputText value="#{evento.fechaInicial}">
									<f:convertDateTime type="date"
										pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}" />
								</h:outputText>
							</p:column>
							<p:column visible="#{reporteGestionEscolarBean.visible[7]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.col.areaResponsable')}" />
								</f:facet>
								<h:outputText value="#{evento.fechaFinal}">
									<f:convertDateTime type="date"
										pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}" />
								</h:outputText>
							</p:column>
							<p:column visible="#{reporteGestionEscolarBean.visible[8]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.col.tipoEvento')}" />
								</f:facet>
								<h:outputText
									value="#{evento.fichaDescriptivaPrograma.catNivelConocimiento.nombre}" />
							</p:column>

							<p:column visible="#{reporteGestionEscolarBean.visible[9]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteGestion.col.nivelConocimiento')}" />
								</f:facet>
								<h:outputText
									value="#{reporteGestionEscolarBean.obtenerCantidadAlumnosPorEvento(evento.idEvento)}" />
							</p:column>

							<p:column visible="#{reporteGestionEscolarBean.visible[10]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.col.seriado')}" />
								</f:facet>
								<h:outputText
									value="#{reporteGestionEscolarBean.obtenerNombreEntidadPorId(evento.idEntidadFederativa)}" />
							</p:column>

							<p:column visible="#{reporteGestionEscolarBean.visible[11]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteGestion.dirigidoA')}" />
								</f:facet>
								<h:outputText
									value="#{reporteGestionEscolarBean.obtenerPromedioAsistencia(evento.idEvento)}" />
							</p:column>

							<p:column visible="#{reporteGestionEscolarBean.visible[12]}"
								exportable="true">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.col.ecPorPrograma')}" />
								</f:facet>
								<h:outputText
									value="#{reporteGestionEscolarBean.obtenerPromedioCalificacion(evento.idEvento)}" />
							</p:column>

						</p:dataTable>
					</p:panel>
				</div>
			</div>
			<div class="form-group">
				<div class="row">
					<div class="col-md-12 floatFlexCentrarY margenInferior">
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.reporteExcel')}" style="margin-bottom:0"
							styleClass="margenDerecho agregaHeight" for="btnReporte" />
						<p:commandButton id="btnReporte" value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.descargar')}"
							style="margin-left:0; margin-right:10px"
							disabled="#{reporteGestionEscolarBean.eventosCapacitacion.isEmpty()}"
							styleClass="btn btn-primary" ajax="false">
							<p:dataExporter type="xls" target="tblProgramas"
								fileName="analisisDatosEventos" pageOnly="false" />
						</p:commandButton>

						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.informePredisenado')}"
							style="margin-bottom:0" styleClass="margenDerecho" />

						<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.generar')}"
							disabled="#{reporteGestionEscolarBean.eventosCapacitacion.isEmpty()}"
							onclick="graficasEventos();"
							styleClass="btn btn-primary margenDerecho quitaMargen" />

						<p:remoteCommand name="graficasEventos"
							action="#{reporteGestionEscolarBean.generarEstadisticas}" update="@form"
							oncomplete="cargaGraficasEventos(xhr, status, args); PF('modalAnalisis').show(); scrollArribaEventos();" />							

						<p:remoteCommand name="scrollArribaEventos"
							action="#{reporteGestionEscolarBean.scrollArriba}" />


					</div>
				</div>
			</div>
			
			<p:dialog widgetVar="modalAnalisis" modal="true" resizable="false"
				id="modalInformeEventos" draggable="false" closable="false"
				position="center" width="900"
				styleClass="modalAnalisisDatos modalAbsoluto"
				header="#{reporteGestionEscolarBean.renderizarEstado ? sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.tituloEstado') : sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.tituloGeneral')}">
				<div class="row">
					<div class="col-md-12 text-right">

							<p:outputPanel layout="block"
								rendered="#{((reporteGestionEscolarBean.filtros.fechaInicial != null) and (reporteGestionEscolarBean.filtros.fechaFinal != null))}">

							<p:outputLabel
								value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.programasQue')} #{reporteGestionEscolarBean.tipoDatoFecha(reporteGestionEscolarBean.tipoDatoFechas)}"
								styleClass="labelSuperior labelRangoFechas bloque"  style="margin:0"/>
							<p:outputLabel />

							<p:outputLabel
								value="#{reporteGestionEscolarBean.filtros.fechaInicial}"
								styleClass="labelSuperior labelFecha">
								<f:convertDateTime type="date"
									pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}" />
							</p:outputLabel>
							<h:outputText value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.modal.y')}" style="margin-left:5px; margin-right:5px"
								styleClass="labelSuperior labelFecha" />
							<p:outputLabel
								value="#{reporteGestionEscolarBean.filtros.fechaFinal}"
								styleClass="labelSuperior labelFecha">
								<f:convertDateTime type="date"
									pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}" />
							</p:outputLabel>
						</p:outputPanel>

					</div>
				</div>
				<div class="row">
					<div class="col-md-5">
						<p:outputPanel layout="block"
							rendered="#{reporteGestionEscolarBean.renderizarEstado}">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.entidad')}"
								styleClass="bloque labelSuperior" />

							<p:outputLabel
								value="#{reporteGestionEscolarBean.obtenerNombreEntidadPorId(reporteGestionEscolarBean.filtros.idEntidadFederativa)}"
								styleClass="bloque numeroGrande gEntidad" />
						</p:outputPanel>
					</div>
				</div>


				<div class="form-group">
					<div class="row">
						<div class="col-md-4 text-center fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.total')}" styleClass="bloque labelSuperior" />
							<p:outputLabel value=""
								styleClass="bloque numeroGrande gTotalEventos" />
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.programas')}" styleClass="bloque labelInferior" />
						</div>

					</div>
				</div>
				<div class="form-group">
					<div class="row">
						<div class="col-md-12 fondoGris">
							<p:outputLabel
								value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.programasTipoCompetencia')}"
								styleClass="bloque text-center tituloSuperior" />
							<div id="competenciaEventos"></div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="row">
						<div class="col-md-12 fondoGris">
							<p:outputLabel
								value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.programasEjeCapacitacion')}"
								styleClass="bloque text-center tituloSuperior" />
							<div id="ejeCapEventos"></div>
						</div>
					</div>
				</div>
				<div class="form-group">

					<div class="row">
						<div class="col-md-12 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.programasPorPrograma')}"
								styleClass="bloque text-center tituloSuperior" />
							<div id="programaEventos"></div>

						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="row">
						<div class="col-md-12">
							<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.verProgramas')}"
								style="width:200px; margin-bottom:5px; margin-left:0px"
								styleClass="btn btn-primary listaDeProgramas"
								onclick="mostrarListaProgramas()" />
							<div id="contenedorNombresProgramas" style="display: none;"
								class="fondoGris"></div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="row">
						<!-- GRAFICA EVENTOS POR MODALIDAD -->
						<div class="col-md-6 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.modalidad')}"
								styleClass="bloque text-center tituloPastel" />
							<div id="modalidadEventos" class="medidaGrafica"></div>
						</div>
						<!-- GRAFICA USUARIOS POR ESTATUS -->
						<div class="col-md-6 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.clasificacion')}"
								styleClass="bloque text-center tituloPastel" />
							<div id="privadosEventos" class="medidaGrafica"></div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="row">
						<div class="col-md-6 fondoGris">
							<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteProgramas.modal.tipoEvento')}"
								styleClass="bloque text-center tituloPastel" />
							<div id="tiposEventos" class="medidaGrafica"></div>
						</div>
						<div class="col-md-6 fondoGris">
