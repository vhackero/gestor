<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:sec="http://www.springframework.org/security/tags">
	<ui:define name="breadcrumb">
		<li>#{sistema.obtenerTexto('gw.analisis.titulo')}</li>
		<li class="active">#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.titulo')}</li>
	</ui:define>
	<ui:define name="content">

		<h:form>
			<div class="row">
				<div class="col-md-12">

					<p:panel header="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.busqueda.titulo')}">
						<div class="form-group">
							<div class="row">
								<div class="col-md-4">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.sede')}" for="selSede" styleClass="bloque" />
									<p:selectOneMenu id="selSede" styleClass="col-xs-12"
										value="#{reporteReservacionesBean.criteriosBusq.idSede}"
										valueChangeListener="#{reporteReservacionesBean.onChangeSede}">
										<p:ajax update="selArea" />
										<f:selectItem
											itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											noSelectionOption="true" />
										<f:selectItems value="#{reporteReservacionesBean.sedes}"
											var="sede"
											itemLabel="#{sede.catUbicacionTerritorial.nombre} - #{sede.nombre}"
											itemValue="#{sede.idSede}" />
									</p:selectOneMenu>
								</div>

								<div class="col-md-4">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.area')}" for="selArea" styleClass="bloque" />
									<p:selectOneMenu id="selArea" styleClass="col-xs-12"
										value="#{reporteReservacionesBean.criteriosBusq.idArea}">
										<f:selectItem
											itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											noSelectionOption="true" />
										<f:selectItems
											value="#{reporteReservacionesBean.areasConfiguradas}"
											var="area" itemLabel="#{area.catAreasSede.catArea.nombre}"
											itemValue="#{area.catAreasSede.catArea.id}" />
									</p:selectOneMenu>
								</div>

								<div class="col-md-4">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.tipoEvento')}" for="selTipoEvento"
										styleClass="bloque" />
									<p:selectOneMenu id="selTipoEvento" styleClass="col-xs-12"
										value="#{reporteReservacionesBean.criteriosBusq.tipoEvento}">
										<f:selectItem
											itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											noSelectionOption="true" />
										<f:selectItems
											value="#{reporteReservacionesBean.tiposEvento()}" var="tipo"
											itemLabel="#{tipo.descripcion}" itemValue="#{tipo.valor}" />
									</p:selectOneMenu>
								</div>
							</div>
						</div>
						<div class="form-group">
							<div class="row">
								<div class="col-md-4">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.estatus')}" for="selEstatus"
										styleClass="bloque" />
									<p:selectOneMenu id="selEstatus" styleClass="col-xs-12"
										value="#{reporteReservacionesBean.criteriosBusq.idEstatusReservacion}">
										<f:selectItem
											itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											noSelectionOption="true" />
										<f:selectItems
											value="#{reporteReservacionesBean.estatusReservacion()}"
											var="estatus" itemLabel="#{estatus.descripcion}"
											itemValue="#{estatus.valor}" />
									</p:selectOneMenu>
								</div>

								<div class="col-md-4">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.fechaInicial')}"
										for="selInicial" styleClass="bloque" />
									<p:calendar id="selInicial" styleClass="requerido"
										pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}"
										yearRange="c-100:c+100" locale="es" navigator="true"
										placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
										showOn="button" readonlyInput="true"
										value="#{reporteReservacionesBean.criteriosBusq.fechaInicial}" />
								</div>

								<div class="col-md-4">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.fechaFinal')}" for="selFinal"
										styleClass="bloque" />
									<p:calendar id="selFinal" styleClass="requerido"
										pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}"
										yearRange="c-100:c+100" locale="es" navigator="true"
										placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
										showOn="button" readonlyInput="true"
										value="#{reporteReservacionesBean.criteriosBusq.fechaFinal}" />
								</div>
							</div>
						</div>

						<!-- Buscar reservaciones -->
						<div class="row">
							<div class="col-md-12">
								<p:commandButton styleClass="btn btn-primary pull-right"
									value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.buscar')}" ajax="false" update="tblReservaciones"
									action="#{reporteReservacionesBean.buscaPorCriterios}" />
							</div>
						</div>


					</p:panel>
				</div>
			</div>
			<div class="row">
				<div class="col-md-12">
					<p:panel header="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.resultado')}">

						<p:dataTable value="#{reporteReservacionesBean.tblReservaciones}"
							tableStyleClass="table" id="tblReservaciones" var="reservacion"
							reflow="true"
							emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.sinRegistros')}"
							paginator="true" paginatorPosition="bottom"
							paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks}
								 {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
							currentPageReportTemplate="({currentPage} de {totalPages})"
							rowsPerPageTemplate="5,10,15">

							<f:facet name="header">
								<div class="row flexY">
									<div class="col-md-8">
										<p:outputLabel
											value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.instruccion')}" />
									</div>
									<div class="col-md-4">
										<p:commandButton id="toggler" type="button"
											value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.columnaDatos')}"
											styleClass="pull-right btn btn-primary"
											icon="ui-icon-carat-1-s" />
										<p:columnToggler datasource="tblReservaciones"
											trigger="toggler" />
									</div>
								</div>
							</f:facet>

							<!-- Datos principales -->
							<p:column visible="#{reporteReservacionesBean.visible[0]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.area')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.areaSede.catArea.nombre}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[1]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.tipoEvento')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.tipoEvento}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[2]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.nombreEvento')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.nombreEvento}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[3]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.eventoPrivado')}" />
								</f:facet>

								<p:outputLabel
									value="#{reservacion.solicitud.privado eq 0 or reservacion.solicitud.privado eq null? sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.no') : sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.si')}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[4]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.solicitante')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.solicitud.solicitante}" />
							</p:column>

							<!-- Columnas ocultas -->
							<p:column visible="#{reporteReservacionesBean.visible[5]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.estatus')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.estatusReservacion.nombre}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[6]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.fechaSolicitud')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.fechaCreacion}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[7]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.distribucion')}" />
								</f:facet>

								<p:outputLabel
									value="#{reservacion.personalizacion.distribucionArea.nombre}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[8]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.servicioCafeteria')}" />
								</f:facet>

								<p:outputLabel
									value="#{reservacion.personalizacion.servicioCafeteria eq 0 or reservacion.personalizacion.servicioCafeteria eq null? sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.no') : sistema.obtenerTexto('gw.analisis.reporteUsuarios.valor.si')}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[9]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.horaInicio')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.horaInicial()}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[10]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.horaFin')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.horaFinal()}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[11]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.ubicacion')}" />
								</f:facet>

								<p:outputLabel
									value="#{reservacion.areaSede.catSede.catUbicacionTerritorial.nombre}" />
							</p:column>

							<p:column visible="#{reporteReservacionesBean.visible[12]}"
								exportable="true">
								<f:facet name="header">
									<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.col.sede')}" />
								</f:facet>

								<p:outputLabel value="#{reservacion.areaSede.catSede.nombre}" />
							</p:column>

						</p:dataTable>

					</p:panel>
				</div>
			</div>
			<div class="form-group">
				<div class="row">
					<div class="col-md-12 floatFlexCentrarY margenInferior">
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.reporteExcel')}"
							styleClass="margenDerecho" for="btnReporte" />
						<p:commandLink id="btnReporte" value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.descargar')}"
							style="margin-left:0; margin-right:10px"
							styleClass="btn btn-primary" ajax="false">
							<p:dataExporter type="xls" target="tblReservaciones"
								fileName="analisisDatosReservaciones" pageOnly="true" />
						</p:commandLink>
						<p:outputLabel value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.informePredisenado')}"
							styleClass="margenDerecho" />
						
						
				
						<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.generar')}"
							styleClass="btn btn-primary margenDerecho quitaMargen"
							disabled="#{reporteReservacionesBean.tblReservaciones.isEmpty()}"
							onclick="graficasReservaciones();" />

						<p:remoteCommand name="graficasReservaciones"
							action="#{reporteReservacionesBean.generaEstadisticas}"
							oncomplete="cargaGraficasReservaciones(xhr, status, args); PF('modalAnalisis').show(); scrollArribaEventos();" />

						<p:remoteCommand name="scrollArribaReservaciones"
							action="#{reporteReservacionesBean.scrollArriba}" />
					</div>
				</div>
			</div>
			<p:dialog widgetVar="modalAnalisis" modal="true" resizable="false"
				id="modalInformeReservaciones" draggable="false" closable="false"
				position="center" width="900"
				styleClass="modalAnalisisDatos modalAbsoluto"
				header="#{sistema.obtenerTexto('gw.analisis.reporteReservaciones.modal.titulo')}">
				

				<f:facet name="footer">
					<div class="row">
						<div class="col-md-12 text-right">
							<p:commandButton value="#{sistema.obtenerTexto('gw.analisis.reporteUsuarios.cerrar')}"
								onclick="PF('modalAnalisis').hide();"
								styleClass="btn btn-default" />
						</div>
					</div>
				</f:facet>
			</p:dialog>
</h:form>
	</ui:define>
</ui:composition>
