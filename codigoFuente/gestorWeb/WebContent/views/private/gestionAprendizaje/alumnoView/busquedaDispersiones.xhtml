<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:sec="http://www.springframework.org/security/tags">

	<ui:define name="breadcrumb">
		<li>Dispersiones</li>

	</ui:define>

	<ui:define name="content">
		<h:form>
			<h1>
				<p:outputLabel styleClass="h1" value="Proceso de dispersión" />
			</h1>


			<p:ajaxStatus onstart="PF('dialogLayout').show()"
				onsuccess="PF('dialogLayout').hide()" />

			<br />

			<div class="form-group ">




				<div class="row">


					<sec:authorize access="hasPermission(null,'DISPER_NUEVA')">


						<p:commandButton value="Nuevo proceso de dispersión"
							style="width: 250px;"
							action="#{dispersionesBean.navegaNuevoConvocatoria}" ajax="false"
							immediate="true" process="@this" styleClass="btn btn-primary" />

					</sec:authorize>

					<sec:authorize access="hasPermission(null,'DISPER_CONSUL')">

						<p:commandButton style="width: 250px;"
							value="Consultar dispersión"
							action="#{convocatoriasBean.navegaConsultaConvocatoria}"
							ajax="false" immediate="true" process="@this"
							styleClass="btn btn-primary" />

					</sec:authorize>

					<sec:authorize access="hasPermission(null,'DISPERSION')">

						<p:commandButton style="width: 250px;" value="Dispersión"
							action="#{convocatoriasBean.navegaConsultaTablero}" ajax="false"
							immediate="true" process="@this" styleClass="btn btn-primary" />

					</sec:authorize>

				</div>


			</div>



			<div></div>


			<!-- Incluir dinámicamente el archivo .xhtml basado en la propiedad 'paginaActual' -->
			<ui:include src="#{dispersionesBean.paginaActual}" />



		</h:form>
	</ui:define>
</ui:composition>
