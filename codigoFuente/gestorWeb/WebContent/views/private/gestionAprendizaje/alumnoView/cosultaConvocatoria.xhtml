<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">


	<h:panelGroup id="contenidoConvocatoria" layout="block">
	<p:panel header="Consulta Convocatoria" rendered="#{convocatoriasBean.mostrarConsultaConvocatoria}">


		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" for="consulNombreConvocatoria"
						value="Nombre:" rendered="true" />
					<p:inputText id="consulNombreConvocatoria"
						value="#{convocatoriasBean.convocatoriaParamConsulta.consulNombreConvocatoria}"
						styleClass="form-control"  required="true"
                				 requiredMessage="El nombre de la convocatoria es requerido"/>
						<p:message for="consulNombreConvocatoria" display="text" />

				</div>

				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque" for="consulNombreCorto"
						value="Nombre corto:" rendered="true" />
					<p:inputText id="consulNombreCorto" 
						value="#{convocatoriasBean.convocatoriaParamConsulta.consulNombreCorto}"
						styleClass="form-control" />

				</div>

				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque" value="Estatus:" />
					<p:selectOneMenu
						value="#{convocatoriasBean.convocatoriaParamConsulta.valueConvocatoriaEstatus}"
						styleClass="col-xs-12">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{convocatoriasBean.estatusLista}"
							var="modalidad" itemLabel="#{modalidad.nombreEstatus}"
							itemValue="#{modalidad.valorEstatus}" />
					</p:selectOneMenu>

				</div>

			</div>
		</div>

		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">
								<p:outputLabel styleClass="bloque"
											   value="Fecha de apertura:" />
								<p:calendar id="fc_fechaInicial" styleClass="requerido" timeZone="#{convocatoriasBean.zonaHoraria}"
											pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')} HH:mm"
											hourFormat="24"
											yearRange="c-100:c+100" locale="es"
											
											placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											readonlyInput="true" navigator="true"
											value="#{convocatoriasBean.convocatoriaParamConsulta.consulFechaApertura}"
											showOn="button"  required="true"
                							requiredMessage="La fecha de apertura es obligatoria.">
									<p:ajax event="dateSelect" process="@this"
											listener="#{convocatoriasBean.validarFechas()}" />
								</p:calendar>
 								<p:message for="fc_fechaInicial" display="text" />
							</div>
							<!-- Fecha Final -->
							<div class="col-md-4 col-xs-12">
								<p:outputLabel styleClass="bloque"
											   value="Fecha de cierre:" />
								<p:calendar id="fc_fechaFinal" styleClass="requerido" timeZone="#{convocatoriasBean.zonaHoraria}"
											mindate="#{convocatoriasBean.convocatoriaParamConsulta.consulFechaApertura}"
											pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')} HH:mm"
											hourFormat="24"
											yearRange="c-100:c+100" locale="es"
											placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											readonlyInput="true" navigator="true"
											value="#{convocatoriasBean.convocatoriaParamConsulta.consulFechaCierre}"
											showOn="button"  required="true"
                							requiredMessage="La fecha de cierre es obligatoria.">
									<p:ajax event="dateSelect" process="@this" />
								</p:calendar>
								 <p:message for="fc_fechaFinal" display="text" />
							</div>



				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque" value="Nivel educativo:" />
					<p:selectOneMenu
						value="#{convocatoriasBean.convocatoriaParamConsulta.consulNivelEducativo}"
						styleClass="col-xs-12">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{convocatoriasBean.listaNivelEducativo}"
							var="modalidad" itemLabel="#{modalidad.nombre}"
							itemValue="#{modalidad.id}" />
					</p:selectOneMenu>

				</div>


			</div>
		</div>
		
		<div class="form-group">
			<div class="row">

				<div class="col-md-12 text-right">
				
					<p:commandButton value="Cancelar" process="@this" update="@form"
										 action="#{convocatoriasBean.cancelar}" ajax="true" global="false"
										 styleClass="btn btn-default" />
						
						<p:commandButton value="Limpiar campos" process="@this" update="@form"
										 action="#{convocatoriasBean.limpiarFiltros}" ajax="true" global="false"
										 styleClass="btn btn-default" />

					
						<p:commandButton id="btnBusquedaAvas" process="@form" ajax="true" global="false"
							update=":convocatoriasForm:resultadosConvocatoria :convocatoriasForm:mensajesConvocatoria"
							onstart="PF('dialogLayout').show();"
							oncomplete="PF('dialogLayout').hide();"
							onerror="PF('dialogLayout').hide();"
							styleClass="btn btn-primary pull-right"
							action="#{convocatoriasBean.consultarFiltros}"
							value="#{sistema.obtenerTexto('gw.ga.btn.buscar')}" />
					
					
					
				</div>
			</div>
		</div>
		
		
		<h:panelGroup id="resultadosConvocatoria" layout="block">
		<div class="row" >
			<div class="col-md-12">
				<p:dataTable id="id"
					emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.sinRegistros')}"
					reflow="true" value="#{convocatoriasBean.listaConvocatoria2}"
					var="convo" paginator="true" rows="10" paginatorPosition="bottom"
					paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
					currentPageReportTemplate="({currentPage} de {totalPages})"
					rowsPerPageTemplate="5,10,15" tableStyleClass="table">

					<!-- Nombre Materia -->
					<p:column style="display: none" styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Convocatoria" />
						</f:facet>
						<h:outputText value="#{convo.convocatoriaId}" />
					</p:column>
					
					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Convocatoria" />
						</f:facet>
						<h:outputText value="#{convo.nombre}" />
					</p:column>
					
					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Nombre Corto" />
						</f:facet>
						<h:outputText value="#{convo.nombreCorto}" />
					</p:column>
					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Fecha apertura" />
						</f:facet>
						<h:outputText value="#{convo.fecha_Apertura}" />
					</p:column>
					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Fecha cierre" />
						</f:facet>
						<h:outputText value="#{convo.fechaCierre}" />
					</p:column>
					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Nivel educativo" />
						</f:facet>
						<h:outputText value="#{convo.nombreNivel}" />
					</p:column>
					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Estatus" />
						</f:facet>
						<h:outputText value="#{convo.activo}" />
					</p:column>
					
					
					<p:column styleClass="text-center">
						<p:commandButton ajax="true" global="false" process="@this"
							update=":convocatoriasForm:resultadosConvocatoria :convocatoriasForm:mensajesConvocatoria"
							onstart="PF('dialogLayout').show();"
							oncomplete="PF('dialogLayout').hide();"
							onerror="PF('dialogLayout').hide();"
							action="#{convocatoriasBean.eliminar}"
							icon="fa fa-trash" styleClass="btn-icon btn btn-default">
							<f:setPropertyActionListener value="#{convo}"
								target="#{convocatoriasBean.elminarConvo}" />
						</p:commandButton>
						
						<p:commandButton ajax="true" global="false" process="@this"
							update=":convocatoriasForm:contenidoConvocatoria :convocatoriasForm:mensajesConvocatoria"
							onstart="PF('dialogLayout').show();"
							oncomplete="PF('dialogLayout').hide();"
							onerror="PF('dialogLayout').hide();"
							action="#{convocatoriasBean.editarConvocatoria}"
							icon="fa fa-pencil" styleClass="btn-icon btn btn-default">
							<f:setPropertyActionListener value="#{convo}"
								target="#{convocatoriasBean.editarConv}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
			</div>
		</div>
		</h:panelGroup>

		

	</p:panel>
	
	
	
		
		
		<p:panel header="Editar Convocatoria" rendered="#{convocatoriasBean.mostrarNuevaConvocatoria}">
	
	<div class="form-group">
					<div class="row">

						<div class="col-md-4 col-xs-12">

							<p:outputLabel styleClass="bloque requerido" for="altaNombreConvocatoria"
								value="Nombre de la convocatoria:" rendered="true" />
							<p:inputText id="altaNombreConvocatoria"
								value="#{convocatoriasBean.convocatoriaParamNueva.altaNombreConvocatoria}"
								styleClass="form-control  " 
								 required="true"
                				 requiredMessage="El nombre de la convocatoria es requerido"
                				  widgetVar="nombreConvocatoriaInput"
      							  onkeyup="PF('nombreCortoInput').jq.val(this.value.substring(0, 3) + ' ' + new Date().getFullYear() + '-1');" />
                				
 							<p:message for="altaNombreConvocatoria" display="text" />
						</div>

						<div class="col-md-4 col-xs-12">

							<p:outputLabel styleClass="bloque requerido" for="altaNombreCorto"
								value="Nombre corto:" rendered="true" />
							<p:inputText id="altaNombreCorto"
								value="#{convocatoriasBean.convocatoriaParamNueva.altaNombreCorto}"
								styleClass="form-control" required="true"
                				 requiredMessage="El campo es requerido"  widgetVar="nombreCortoInput" /> 
 							<p:message for="altaNombreConvocatoria" display="text" />

						</div>

						<div class="col-md-4 col-xs-12">

							<p:outputLabel styleClass="bloque" for="altaDescripcion"
								value="Descripción:" rendered="true" />
							<p:inputTextarea  id="altaDescripcion"
											value="#{convocatoriasBean.convocatoriaParamNueva.altaDescripcion}"
											styleClass="form-control"  
											 rows="5" cols="30" 
			                    			 autoResize="false" />

						</div>



					</div>
				</div>
				
				<div class="form-group">
					<div class="row">



						<div class="col-md-4">
								<p:outputLabel styleClass="bloque requerido"
											   value="Fecha de apertura:" />
								<p:calendar id="fc_fechaInicialAlta" timeZone="#{convocatoriasBean.zonaHoraria}"
											pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFechaHora')}"
											hourFormat="24"
											yearRange="c-100:c+100" locale="es"
											
											placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											readonlyInput="true" navigator="true"
											value="#{convocatoriasBean.convocatoriaParamNueva.altaFechaApertura}"
											showOn="button" required="true"
                							requiredMessage="La fecha de apertura es obligatoria.">
								</p:calendar>
								<p:message for="fc_fechaInicialAlta" display="text" />

							</div>
							<!-- Fecha Final -->
							<div class="col-md-4">
								<p:outputLabel styleClass="bloque requerido"
											   value="Fecha de cierre:" />
								<p:calendar id="fc_fechaFinalAlta" timeZone="#{convocatoriasBean.zonaHoraria}"
											pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFechaHora')}"
											hourFormat="24"
											yearRange="c-100:c+100" locale="es"
											placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											readonlyInput="true" navigator="true"
											value="#{convocatoriasBean.convocatoriaParamNueva.altaFechaCierre}"
											showOn="button"   required="true"
                							requiredMessage="La fecha de cierre es obligatoria.">
								</p:calendar>
								 <p:message for="fc_fechaFinalAlta" display="text" />
							</div>


							<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido"
						value="Nivel educativo:" />

					<p:selectCheckboxMenu
						value="#{convocatoriasBean.convocatoriaParamNueva.listaPlanProgramaNivel}"
						id="altaNivelEducativo" styleClass="col-xs-12" required="false"
						requiredMessage="El nivel educativo es obligatorio." label="Seleccionar">

						<f:selectItems
							value="#{convocatoriasBean.convocatoriaParamNueva.listaPlanPrograma}"
							var="modalidad"
							itemLabel="#{modalidad.nombreivelEnsenanza} > #{modalidad.nombrePlan}  > #{modalidad.nombreSemestre} > #{modalidad.nombreBloque} > #{modalidad.nombrePrograma}"
							itemValue="#{modalidad}" />

					</p:selectCheckboxMenu>
					<p:message for="altaNivelEducativo" display="text" />
				</div>


					</div>
				</div>


				<div class="form-group">
					<div class="row">


						<div class="col-md-4 col-xs-12">

							<p:outputLabel styleClass="bloque" for="altaUrl"
								value="URL de la convocatoria(PDF):" rendered="true" />
							<p:inputText id="altaUrl" value="#{convocatoriasBean.convocatoriaParamNueva.altaUrl}"
								styleClass="form-control" />

						</div>

						<div class="col-md-4 col-xs-12">

							<p:outputLabel styleClass="bloque requerido" value="Estatus:" />
							<p:selectOneMenu id="altaEstatus"  value="#{convocatoriasBean.convocatoriaParamNueva.altaEstatus}"
								styleClass="col-xs-12"  required="true" 
                     requiredMessage="El estatus es obligatorio.">
								<f:selectItem
									itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
									itemValue="#{null}" />
								<f:selectItems value="#{convocatoriasBean.estatusLista}"
									var="modalidad" itemLabel="#{modalidad.nombreEstatus}"
									itemValue="#{modalidad.valorEstatus}" />

							</p:selectOneMenu>
							 <p:message for="altaEstatus" display="text" />
						</div>


					</div>
				</div>

				<div class="form-group">
					<div class="row">


						<!-- Fecha Inicial  -->
						<div class="col-md-4">
							<p:outputLabel styleClass="bloque requerido" value="Fecha Alta:" />
							<p:calendar id="fc_fechaFinal2" timeZone="#{convocatoriasBean.zonaHoraria}"
											disabled="true"
											pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}"
											yearRange="c-100:c+100" locale="es"
											placeholder="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
											readonlyInput="true" navigator="true"
											value="#{convocatoriasBean.convocatoriaParamNueva.altaFechaAlta}"
											showOn="button"  >
							</p:calendar>
						
						</div>

						<div class="col-md-4 col-xs-12">

							<p:outputLabel styleClass="bloque" for="altaDescripcion"
								value="Cupo Límite:" rendered="true" />
							<p:inputText id="altaCupoLimite"
								value="#{convocatoriasBean.convocatoriaParamNueva.altaCupoLimite}"
								styleClass="form-control" />

						</div>
						


					</div>
				</div>
	
		<div class="form-group">
			<div class="row">

				<div class="col-md-12 text-right">
				
					<p:commandButton value="Cancelar" process="@this"
										 update=":convocatoriasForm:contenidoConvocatoria"
										 action="#{convocatoriasBean.cancelar2}" ajax="true" global="false"
										 styleClass="btn btn-default" />
						
						<p:commandButton value="Limpiar campos" process="@this"
										 update=":convocatoriasForm:contenidoConvocatoria"
										 action="#{convocatoriasBean.limpiarEdicion}" ajax="true" global="false"
										 styleClass="btn btn-default" />

					
						<p:commandButton id="btnBusquedaAvas2" ajax="false"
							onclick="PF('dialogLayout').show();"
							styleClass="btn btn-primary pull-right"
							action="#{convocatoriasBean.editarConvocatoriaBD}"
							value="Guardar" />
					
					
					
				</div>
			</div>
		</div>

		
	</p:panel>
	</h:panelGroup>

	<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgValidarSeleccion" header="Informativo" dynamic="true">
			<div class="form-group">
				<div class="row">
					<div class="col-md-12">
						<h:outputText styleClass="bloque"
							value="No se encontraron convocatorias." />
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Cerrar" styleClass="btn btn-default"
						onclick="PF('dlgValidarSeleccion').hide()" />
				</div>
			</div>
		</p:dialog>
		
		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgValidarSeleccion2" header="Informativo" dynamic="true">
			<div class="form-group">
				<div class="row">
					<div class="col-md-12">
						<h:outputText styleClass="bloque"
							value="Ingrese los datos marcados como obligatorios." />
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Cerrar" styleClass="btn btn-default"
						onclick="PF('dlgValidarSeleccion2').hide()" />
				</div>
			</div>
		</p:dialog>
		
		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgValidarSeleccion3" header="Informativo" dynamic="true">
			<div class="form-group">
				<div class="row">
					<div class="col-md-12">
						<h:outputText styleClass="bloque"
							value="Convocatoria eliminada correctamente." />
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Cerrar" styleClass="btn btn-default"
						onclick="PF('dlgValidarSeleccion3').hide()" />
				</div>
			</div>
		</p:dialog>
		
		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgValidarSeleccion4" header="Informativo" dynamic="true">
			<div class="form-group">
				<div class="row">
					<div class="col-md-12">
						<h:outputText styleClass="bloque"
							value="Error." />
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Cerrar" styleClass="btn btn-default"
						onclick="PF('dlgValidarSeleccion4').hide()" />
				</div>
			</div>
		</p:dialog>
		
		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgValidarSeleccion7" header="Informativo" dynamic="true">
			<div class="form-group">
				<div class="row">
					<div class="col-md-12">
						<h:outputText styleClass="bloque"
							value="La convocatoria no puede ser eliminada ya que la fecha apertura es igual o menor al dia actual." />
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Cerrar" styleClass="btn btn-default"
						onclick="PF('dlgValidarSeleccion7').hide()" />
				</div>
			</div>
		</p:dialog>	
		
		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgValidarSeleccion77" header="Informativo" dynamic="true">
			<div class="form-group">
				<div class="row">
					<div class="col-md-12">
						<h:outputText styleClass="bloque"
							value="La convocatoria se a actualizado correctamente." />
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Cerrar" styleClass="btn btn-default"
						onclick="PF('dlgValidarSeleccion77').hide()" />
				</div>
			</div>
		</p:dialog>	
		

</ui:composition>
