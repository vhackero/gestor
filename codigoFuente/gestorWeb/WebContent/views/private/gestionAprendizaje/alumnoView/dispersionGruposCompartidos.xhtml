<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:fragment rendered="#{not dispersionesBean.mostrarDefinicionGruposCompartidos and not dispersionesBean.mostrarFormularioCrearGrupos}">
	<p:panel header="Dispersión en grupos compartidos">

		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">
					<p:outputLabel styleClass="bloque requerido"
						value="Proceso de inscripción con dispersión:" />
					<p:selectOneMenu id="procesoCompartidoConDispersion" required="true"
						styleClass="col-xs-12"
						value="#{dispersionesBean.dispercionParametros.idProcesoInscripcionConDispersion}">
						<p:ajax event="change" process="@this" update="@form"
							listener="#{dispersionesBean.onProcesoCompartidoSeleccionado}" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{dispersionesBean.listaProcesosConDispersion}"
							var="proc" itemLabel="#{proc.nombre}"
							itemValue="#{proc.idProcesoInscripcion}" />
					</p:selectOneMenu>
					<p:message for="procesoCompartidoConDispersion" display="text" />
					<h:outputText styleClass="text-danger"
						rendered="#{not empty dispersionesBean.mensajeProcesosConDispersion}"
						value="#{dispersionesBean.mensajeProcesosConDispersion}" />
				</div>

				<div class="col-md-4 col-xs-12">
					<p:outputLabel styleClass="bloque requerido"
						value="Programas compartidos:" />
					<p:selectOneMenu id="programaCompartido" required="true"
						styleClass="col-xs-12"
						value="#{dispersionesBean.dispercionParametros.nombreProgramaCompartidoSeleccionado}">
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{dispersionesBean.listaProgramasCompartidos}"
							var="programa" itemLabel="#{programa}" itemValue="#{programa}" />
					</p:selectOneMenu>
					<p:message for="programaCompartido" display="text" />
					<h:outputText styleClass="text-danger"
						rendered="#{not empty dispersionesBean.mensajeProgramasCompartidos}"
						value="#{dispersionesBean.mensajeProgramasCompartidos}" />
				</div>

			</div>
		</div>

		<div class="form-group">
			<div class="row">

				<div class="col-md-12 text-right">

					<p:commandButton value="Cancelar" process="@this" update="@form"
						action="#{dispersionesBean.cancelarDispersionGruposCompartidos}"
						ajax="true" styleClass="btn btn-default" />

					<p:commandButton value="Limpiar campos" process="@this"
						update="@form"
						action="#{dispersionesBean.limpiarCamposDispersionGruposCompartidos}"
						ajax="true" styleClass="btn btn-default" />

					<p:commandButton id="btnBusquedaGruposCompartidos" process="@form"
						ajax="true" update="@form" styleClass="btn btn-primary pull-right"
						action="#{dispersionesBean.busquedaDispersionGruposCompartidos}"
						value="Aceptar" />

				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12">
				<p:dataTable id="tablaGruposCompartidos" reflow="true"
					emptyMessage="#{dispersionesBean.mensajeTablaDispersionGruposCompartidos}"
					value="#{dispersionesBean.listaDispercionBusqueda}" var="dispercion"
					paginator="true" rows="10" paginatorPosition="bottom"
					paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
					currentPageReportTemplate="({currentPage} de {totalPages})"
					rowsPerPageTemplate="5,10,15" tableStyleClass="table">

					<p:column styleClass="text-center" style="display:none;">
						<h:outputText value="#{dispercion.idDispersion}" />
					</p:column>

					<p:column styleClass="text-center" style="min-width:120px;">
						<f:facet name="header">
							<h:outputText value="Plan" />
						</f:facet>
						<h:outputText value="#{dispercion.plan}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Programa" />
						</f:facet>
						<h:outputText value="#{dispercion.programa}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Clave" />
						</f:facet>
						<h:outputText value="#{dispercion.clave}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Semestre" />
						</f:facet>
						<h:outputText value="#{dispercion.semestre}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Bloque" />
						</f:facet>
						<h:outputText value="#{dispercion.bloque}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="No. de usuarios con inscripción" />
						</f:facet>
						<h:outputText value="#{dispercion.noEstudiantes}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Grupos generales" />
						</f:facet>
						<h:outputText value="#{dispercion.gruposGenerales}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Cupo general" />
						</f:facet>
						<h:outputText value="#{dispercion.cupoGeneral}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Grupos resto" />
						</f:facet>
						<h:outputText value="#{dispercion.grupoResto}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Cupo resto" />
						</f:facet>
						<h:outputText value="#{dispercion.cupoResto}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="Usuarios matriculados" />
						</f:facet>
						<h:outputText value="#{dispercion.usuariosMatriculados}" />
					</p:column>

					<p:column styleClass="text-center" style="min-width:110px;">
						<f:facet name="header">
							<h:outputText value="Define grupos" />
						</f:facet>
						<p:commandButton ajax="true" process="@this" update="@form"
							action="#{dispersionesBean.definirGruposCompartidos(dispercion)}"
							icon="fa fa-pencil" title="Define grupos"
							styleClass="btn-icon btn btn-default"
							disabled="#{not dispercion.definirGruposHabilitado}" />
					</p:column>

					<p:column styleClass="text-center" style="min-width:110px;">
						<f:facet name="header">
							<h:outputText value="Crear grupos" />
						</f:facet>
						<p:commandButton ajax="true" process="@this" update="@form"
							action="#{dispersionesBean.crearGruposCompartidos(dispercion)}"
							icon="fa fa-users" title="Crear grupos"
							styleClass="btn-icon btn btn-default"
							disabled="#{not dispercion.crearGruposHabilitado}" />
					</p:column>

					<p:column styleClass="text-center" style="min-width:130px;">
						<f:facet name="header">
							<h:outputText value="Matricular usuarios" />
						</f:facet>
						<p:commandButton ajax="true" process="@this" update="@form"
							action="#{dispersionesBean.matricularUsuariosCompartidos(dispercion)}"
							icon="fa fa-graduation-cap" title="Matricular usuarios"
							styleClass="btn-icon btn btn-default"
							disabled="#{not dispercion.matricularHabilitado}" />
					</p:column>
				</p:dataTable>
			</div>
		</div>

	</p:panel>
	</ui:fragment>

	<p:panel header="Definición de grupos para dispersión compartida"
		rendered="#{dispersionesBean.mostrarDefinicionGruposCompartidos}">

		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">
					<p:outputLabel styleClass="bloque requerido" for="gruposGeneralesCompartidos"
						value="Grupos generales:" />
					<p:inputText id="gruposGeneralesCompartidos"
						value="#{dispersionesBean.dispersionNuevo.noGrupos}" required="true"
						requiredMessage="Los grupos generales son obligatorios."
						styleClass="form-control" type="number" min="0">
						<f:validateLongRange minimum="0" />
					</p:inputText>
					<p:message for="gruposGeneralesCompartidos" display="text" />
				</div>

				<div class="col-md-4 col-xs-12">
					<p:outputLabel styleClass="bloque requerido" for="cupoGeneralCompartidos"
						value="Cupo general:" />
					<p:inputText id="cupoGeneralCompartidos"
						value="#{dispersionesBean.dispersionNuevo.estudiantesGrupo}"
						required="true" requiredMessage="El cupo general es obligatorio."
						styleClass="form-control" type="number" min="0">
						<f:validateLongRange minimum="0" />
					</p:inputText>
					<p:message for="cupoGeneralCompartidos" display="text" />
				</div>

				<div class="col-md-4 col-xs-12">
					<p:outputLabel styleClass="bloque requerido" for="gruposRestoCompartidos"
						value="Grupos resto:" />
					<p:inputText id="gruposRestoCompartidos"
						value="#{dispersionesBean.dispersionNuevo.grupoResto}" required="true"
						requiredMessage="Los grupos resto son obligatorios."
						styleClass="form-control" type="number" min="0">
						<f:validateLongRange minimum="0" />
					</p:inputText>
					<p:message for="gruposRestoCompartidos" display="text" />
				</div>
			</div>
		</div>

		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">
					<p:outputLabel styleClass="bloque requerido" for="cupoRestoCompartidos"
						value="Cupo resto:" />
					<p:inputText id="cupoRestoCompartidos"
						value="#{dispersionesBean.dispersionNuevo.cupoResto}" required="true"
						requiredMessage="El cupo resto es obligatorio."
						styleClass="form-control" type="number" min="0">
						<f:validateLongRange minimum="0" />
					</p:inputText>
					<p:message for="cupoRestoCompartidos" display="text" />
				</div>

			</div>
		</div>

		<div class="form-group">
			<div class="row">
				<div class="col-md-4 col-xs-12">
					<p:outputLabel styleClass="bloque"
						value="Estudiantes inscritos: #{dispersionesBean.editarDispersion.noEstudiantes}" />
				</div>
			</div>
		</div>

		<div class="form-group">
			<div class="row">

				<div class="col-md-12 text-right">

					<p:commandButton value="Cancelar" process="@this" update="@form"
						action="#{dispersionesBean.cancelarDefinicionGruposCompartidos}"
						ajax="true" styleClass="btn btn-default" />

					<p:commandButton value="Limpiar campos" process="@this"
						update="@form" action="#{dispersionesBean.limpiarDefinicionGruposCompartidos}"
						ajax="true" styleClass="btn btn-default" />

					<p:commandButton id="btnGuardarDefinicionGruposCompartidos"
						process="@form" ajax="true" update="@form"
						styleClass="btn btn-primary pull-right"
						action="#{dispersionesBean.guardarDefinicionGruposCompartidos}"
						value="Aceptar" />

				</div>
			</div>
		</div>

	</p:panel>

	<ui:fragment rendered="#{dispersionesBean.mostrarFormularioCrearGrupos}">
		<p:panel header="Crear Eventos y grupos">
			<div class="form-group">
				<div class="row">
					<div class="col-md-6">
						<p:outputLabel value="Nombre del plan:" styleClass="bloque" />
						<h:outputText
							value="#{empty dispersionesBean.datosPreviosCrear ? dispersionesBean.dispersionSeleccionada.plan : dispersionesBean.datosPreviosCrear.nombrePlan}" />
					</div>
					<div class="col-md-6">
						<p:outputLabel value="Nombre del programa:" styleClass="bloque" />
						<h:outputText
							value="#{empty dispersionesBean.datosPreviosCrear ? dispersionesBean.dispersionSeleccionada.programa : dispersionesBean.datosPreviosCrear.nombrePrograma}" />
					</div>
				</div>
			</div>

			<div class="form-group">
				<div class="row">
					<div class="col-md-4">
						<p:outputLabel styleClass="bloque requerido" value="Estatus de evento(s):" />
						<p:selectOneMenu id="estatusEventoCrearCompartidos"
							value="#{dispersionesBean.formularioCrearEvento.idEstatusEvento}"
							styleClass="col-xs-12">
							<f:selectItem
								itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
								itemValue="#{null}" />
							<f:selectItems value="#{dispersionesBean.listaEstatusEvento}" var="estatus"
								itemLabel="#{estatus.nombre}" itemValue="#{estatus.id}" />
						</p:selectOneMenu>
					</div>
					<div class="col-md-5">
						<p:outputLabel styleClass="bloque requerido"
							value="Nombre del evento académico:" />
						<p:inputText styleClass="col-xs-12"
							value="#{dispersionesBean.formularioCrearEvento.nombreEvento}" />
					</div>
					<div class="col-md-3">
						<p:outputLabel value="Privado:" styleClass="bloque" />
						<p:inputSwitch styleClass="bloque"
							value="#{dispersionesBean.formularioCrearEvento.privado}"
							onLabel="Sí" offLabel="No" />
					</div>
				</div>
			</div>

			<div class="form-group">
				<div class="row">
					<div class="col-md-3">
						<p:outputLabel styleClass="bloque requerido" value="Fecha inicial:" />
						<p:calendar pattern="dd-MMM-yyyy" navigator="true" showIcon="true"
							value="#{dispersionesBean.formularioCrearEvento.fechaInicial}" />
					</div>
					<div class="col-md-3">
						<p:outputLabel styleClass="bloque requerido" value="Fecha final:" />
						<p:calendar pattern="dd-MMM-yyyy" navigator="true" showIcon="true"
							value="#{dispersionesBean.formularioCrearEvento.fechaFinal}" />
					</div>
					<div class="col-md-3">
						<p:outputLabel styleClass="bloque requerido" value="Modalidad:" />
						<p:selectOneMenu id="modalidadCrearCompartidos"
							value="#{dispersionesBean.formularioCrearEvento.idModalidad}"
							styleClass="col-xs-12">
							<f:selectItem
								itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
								itemValue="#{null}" />
							<f:selectItems value="#{dispersionesBean.listaModalidadesEvento}" var="modal"
								itemLabel="#{modal.nombre}" itemValue="#{modal.id}" />
						</p:selectOneMenu>
					</div>
					<div class="col-md-3">
						<p:outputLabel styleClass="bloque requerido" value="Vincular AVA" />
						<p:commandButton value="Vincular" type="button"
							styleClass="btn btn-default"
							onclick="PF('modVincAvaDispersionCompartidos').show(); return false;" />
					</div>
				</div>
			</div>

			<div class="form-group">
				<div class="row">
					<div class="col-md-4">
						<p:outputLabel styleClass="bloque requerido" value="Año periodo:" />
						<p:selectOneMenu styleClass="col-xs-12"
							value="#{dispersionesBean.formularioCrearEvento.anioPeriodo}">
							<f:selectItem
								itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
								itemValue="#{null}" />
							<f:selectItems value="#{dispersionesBean.listaAnioPeriodo}" var="periodo"
								itemLabel="#{periodo}" itemValue="#{periodo}" />
						</p:selectOneMenu>
					</div>
					<div class="col-md-4">
						<p:outputLabel styleClass="bloque requerido" value="Número de elementos:" />
						<p:selectOneMenu styleClass="col-xs-12"
							value="#{dispersionesBean.formularioCrearEvento.numeroElementos}">
							<f:selectItem
								itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
								itemValue="#{null}" />
							<f:selectItems value="#{dispersionesBean.listaNumeroElementos}" var="num"
								itemLabel="#{num}" itemValue="#{num}" />
						</p:selectOneMenu>
					</div>
					<div class="col-md-4">
						<p:outputLabel styleClass="bloque" value="Generar grupo por clave:" />
						<p:inputSwitch styleClass="bloque"
							value="#{dispersionesBean.formularioCrearEvento.generarPorClave}"
							onLabel="Sí" offLabel="No" />
					</div>
				</div>
			</div>

			<div class="form-group">
				<div class="row">
					<div class="col-md-12 text-right">
						<p:commandButton value="Cancelar" process="@this" update="@form"
							action="#{dispersionesBean.cancelarFormularioCrearGrupos}"
							styleClass="btn btn-default" />
						<p:commandButton value="Limpiar campos" process="@this" update="@form"
							action="#{dispersionesBean.limpiarFormularioCrearGrupos}"
							styleClass="btn btn-default" />
						<p:commandButton value="Aceptar" process="@form" update="@form"
							action="#{dispersionesBean.aceptarFormularioCrearGrupos}"
							styleClass="btn btn-primary pull-right" />
					</div>
				</div>
			</div>
		</p:panel>
	</ui:fragment>

	<ui:fragment rendered="#{not empty dispersionesBean.formularioCrearEvento and dispersionesBean.mostrarFormularioCrearGrupos}">
		<p:dialog id="dialogVincularAvaDispersionCompartidos" widgetVar="modVincAvaDispersionCompartidos"
			header="Vincular Ambiente Virtual de Aprendizaje (AVA)" modal="true"
			resizable="false" draggable="false" closable="false" position="center"
			width="650">
			<h:form id="frmVincularAvaDispersionCompartidos">
				<div class="form-group">
					<div class="row">
						<div class="col-md-6">
							<p:outputLabel styleClass="requerido bloque"
								value="Seleccionar la plataforma Moodle" />
							<p:selectOneMenu styleClass="col-xs-12"
								value="#{dispersionesBean.formularioCrearEvento.idPlataformaLms}">
								<p:ajax update="seleccionarAvaDispersionCompartidos autonomoDispersionCompartidos" process="@this" />
								<f:selectItem
									itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
									itemValue="#{null}" />
								<f:selectItems value="#{dispersionesBean.listaPlataformasMoodle}"
									var="plataforma" itemLabel="#{plataforma.descripcion}"
									itemValue="#{plataforma.idParametroWSMoodle}" />
							</p:selectOneMenu>
						</div>
					</div>
				</div>

				<div class="form-group">
					<div class="row">
						<div class="col-md-6">
							<p:outputLabel styleClass="requerido bloque"
								value="Seleccionar AVA" />
							<p:selectOneRadio id="seleccionarAvaDispersionCompartidos"
								disabled="#{dispersionesBean.formularioCrearEvento.idPlataformaLms == null}"
								value="#{dispersionesBean.formularioCrearEvento.idClasificacionAva}">
								<f:selectItems value="#{dispersionesBean.listaClasificacionesAva}"
									var="ava" itemLabel="#{ava.nombre}" itemValue="#{ava.id}" />
							</p:selectOneRadio>
						</div>
						<div class="col-md-6">
							<p:outputLabel styleClass="bloque"
								value="¿Es un evento autónomo?" />
							<p:inputSwitch id="autonomoDispersionCompartidos"
								value="#{dispersionesBean.formularioCrearEvento.eventoAutonomo}"
								onLabel="Sí" offLabel="No"
								disabled="#{dispersionesBean.formularioCrearEvento.idPlataformaLms == null}" />
						</div>
					</div>
				</div>

				<div class="form-group">
					<div class="row">
						<div class="col-md-12">
							<h:outputText
								value="El sistema creará un AVA vacío y se asignará un identificador nuevo" />
						</div>
					</div>
				</div>

				<div class="form-group">
					<div class="row">
						<div class="col-md-12 text-right">
							<p:commandButton value="Cerrar" type="button"
								styleClass="btn btn-default"
								onclick="PF('modVincAvaDispersionCompartidos').hide();" />
						</div>
					</div>
				</div>
			</h:form>
		</p:dialog>
	</ui:fragment>

	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgDispersionInfo" header="Informativo" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
					<h:outputText styleClass="bloque"
						value="#{dispersionesBean.mensajeGestion}" />
				</div>
			</div>
			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Aceptar" styleClass="btn btn-primary"
						type="button" onclick="PF('dlgDispersionInfo').hide()" />
				</div>
			</div>
		</div>
	</p:dialog>

	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgDispersionError" header="Advertencia" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
					<h:outputText styleClass="bloque"
						value="#{dispersionesBean.mensajeGestion}" />
				</div>
			</div>
			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Aceptar" styleClass="btn btn-primary"
						type="button" onclick="PF('dlgDispersionError').hide()" />
				</div>
			</div>
		</div>
	</p:dialog>

	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgValidarSeleccion8" header="Informativo" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
