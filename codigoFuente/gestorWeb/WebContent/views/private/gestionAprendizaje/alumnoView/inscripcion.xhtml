<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="breadcrumb">
		<li>#{sistema.obtenerTexto('gw.alumno.inscripcion.titulo')}</li>
	</ui:define>

	<ui:define name="content">

		<h:form id="mainForm">
			<p:ajaxStatus onstart="PF('dialogLayout').show()"
				onsuccess="PF('dialogLayout').hide()" />

			<h1>
				<p:outputLabel styleClass="h1" value="#{sistema.obtenerTexto('gw.alumno.inscripcion.titulo')}" />
			</h1>

            <p:outputPanel id="avisoUltimaOportunidad" styleClass="mt-2">
                <p:outputPanel rendered="#{not empty inscripcionBean.contextoInscripcion.avisoUltimaOportunidad}">
                    <div class="alert alert-warning" role="alert"><h:outputText value="#{inscripcionBean.contextoInscripcion.avisoUltimaOportunidad}" /></div>
                    <p:selectBooleanCheckbox value="#{inscripcionBean.contextoInscripcion.aceptaUltimaOportunidad}"><p:ajax event="change" process="@this" update="panelFinalizar" /></p:selectBooleanCheckbox>
                    <h:outputText value="#{sistema.obtenerTexto('gw.inscripcion.mensaje.he.leido.el.aviso.de.ultima.oportunidad.de.2')}" />
                </p:outputPanel>
            </p:outputPanel>
            <p:outputPanel id="adeudosAdicionales" />
            <p:outputPanel id="conclusionEstudios" styleClass="mt-2" rendered="#{inscripcionBean.contextoInscripcion != null}">
                <p:outputPanel rendered="#{inscripcionBean.contextoInscripcion.conclusionEstudios.concluido}"><div class="alert alert-info" role="alert"><h:outputText value="#{inscripcionBean.contextoInscripcion.conclusionEstudios.mensaje}" /></div></p:outputPanel>
            </p:outputPanel>
            <p:outputPanel styleClass="mt-2"
				rendered="#{inscripcionBean.mostrarAviso}">
								
				<div class="alert alert-#{inscripcionBean.tipoAviso}" role="alert">#{inscripcionBean.textoAviso}</div>
				
				
			</p:outputPanel>
			
			<p:outputPanel styleClass="mt-2"
				rendered="#{not empty inscripcionBean.obtenerInscripcionPrevia}">
				<div class="form-group mt-2">
					<div class="row">
						<div class="col-md-12">
						<p:dataTable id="tblEditaComp1"
								value="#{inscripcionBean.obtenerInscripcionPrevia}"
								tableStyleClass="table" var="inscripcion" paginator="false"
								emptyMessage="#{sistema.obtenerTexto('gw.alumno.inscripcion.inscripcionPrevia.unidadesDidacticasVacias')}">

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.inscripcionPrevia.plan')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.programa}" />
								</p:column>
								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.inscripcionPrevia.curso')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.asignatura}" />
								</p:column>
								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.inscripcionPrevia.tipo')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.tipoPrograma}" />
								</p:column>
								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.inscripcionPrevia.semestre')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.semestre}" />
								</p:column>
								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.inscripcionPrevia.bloque')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.bloque}" />
								</p:column>

								

							</p:dataTable>
									</div>
					</div>
				</div>
				
			</p:outputPanel>

			<p:panel id="pnlEditEjeComp" header="#{sistema.obtenerTexto('gw.alumno.inscripcion.titulo')}"
				rendered="#{inscripcionBean.contextoInscripcion != null}">
				<div class="row flexCentrarXY" style="align-items: flex-end">
					<div class="col-md-3 col-xs-12">
						<h:outputLabel value="#{sistema.obtenerTexto('gw.alumno.inscripcion.panelCabecera.plan')}" styleClass="bloque" />
						<h:outputText
							value="#{inscripcionBean.contextoInscripcion.inscripcionPersona.plan}" />
					</div>

					<div class="col-md-6 col-xs-12">
						<h:outputLabel value="#{sistema.obtenerTexto('gw.alumno.inscripcion.panelCabecera.matricula')}" styleClass="bloque" />
						<h:outputText
							value="#{inscripcionBean.contextoInscripcion.inscripcionPersona.nombreUsuario}" />
					</div>
				</div>

				<p:outputPanel styleClass="mt-2"
					rendered="#{not empty inscripcionBean.contextoInscripcion.mensajeSeriacion}">
					<div class="alert alert-info mb-0" role="alert">#{inscripcionBean.contextoInscripcion.mensajeSeriacion}</div>
				</p:outputPanel>
				<p:outputPanel rendered="#{not empty inscripcionBean.contextoInscripcion.mensajeReferencia}">
					<div class="alert alert-warning" role="alert">
						<h:outputText value="#{inscripcionBean.contextoInscripcion.mensajeReferencia}" />
					</div>
				</p:outputPanel>

				<p:outputPanel styleClass="mt-2"
					rendered="#{not empty inscripcionBean.contextoInscripcion.mensajeLimiteReprobacionesAlcanzado}">
					<div class="alert alert-#{inscripcionBean.contextoInscripcion.permiteInscripcionLimiteReprobadas ? 'warning' : 'danger'} mb-0" role="alert">#{inscripcionBean.contextoInscripcion.mensajeLimiteReprobacionesAlcanzado}</div>
				</p:outputPanel>

				 <p:outputPanel rendered="#{not empty inscripcionBean.contextoInscripcion.estadoAcademico.avisoCupoOptativas}">
                <div class="alert alert-warning" role="alert">
                    <h:outputText value="#{inscripcionBean.contextoInscripcion.estadoAcademico.avisoCupoOptativas}" />
                </div>
            </p:outputPanel>
            <p:outputPanel id="avisoOmisionReinscripcion" styleClass="mt-2"><p:outputPanel rendered="#{not empty inscripcionBean.contextoInscripcion.mensajeOmisionReinscripcion}">
<div class="alert alert-#{inscripcionBean.contextoInscripcion.permiteInscripcionOmision ? 'warning' : 'danger'}" role="alert"><h:outputText value="#{inscripcionBean.contextoInscripcion.mensajeOmisionReinscripcion}" /></div></p:outputPanel></p:outputPanel>
<div class="form-group mt-1">
					<div class="row">
						<div class="col-md-12">

							<p:dataTable id="tblEditaComp"
								value="#{inscripcionBean.contextoInscripcion.estadoAcademico.materiasDisponibles}"
								tableStyleClass="table" var="inscripcion" paginator="false"
								emptyMessage="#{sistema.obtenerTexto('gw.alumno.inscripcion.unidadesDidacticasDisponibles.unidadesDidacticasVacias')}">

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.unidadesDidacticasDisponibles.curso')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.nombreTentativoPrograma}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.unidadesDidacticasDisponibles.tipo')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.tipoPrograma}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.unidadesDidacticasDisponibles.semestre')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.estructura}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.alumno.inscripcion.unidadesDidacticasDisponibles.bloque')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.subestructura}" />
								</p:column>

                                <p:column headerText="#{sistema.obtenerTexto('gw.inscripcion.adeudo.columna')}"
                                    rendered="#{inscripcionBean.mostrarSelectorAdeudo}">
                                    <p:selectOneMenu value="#{inscripcion.idAdeudoOptativa}" converter="javax.faces.Long"
                                        rendered="#{inscripcion.admiteSustitucionOptativa and not inscripcion.disabled and not inscripcion.oportunidades.agotada}">
                                        <f:selectItem itemLabel="#{sistema.obtenerTexto('gw.inscripcion.adeudo.seleccionar')}"
                                            itemValue="#{null}" noSelectionOption="true" />
                                        <f:selectItems value="#{inscripcionBean.contextoInscripcion.estadoAcademico.adeudosOptativasAdicionales}"
                                            var="adeudo" itemValue="#{adeudo.idOrigen}" itemLabel="#{adeudo.descripcion}"
                                            itemDisabled="#{adeudo.enCurso or not adeudo.admiteOtraOportunidad or not adeudo.admiteSustitucion}" />
                                        <p:ajax process="@this" listener="#{inscripcionBean.validarSeleccionMateria(inscripcion)}"
                                            update=":mainForm:tblEditaComp :pnlMensaje :mainForm:avisoUltimaOportunidad :mainForm:adeudosAdicionales :mainForm:conclusionEstudios :mainForm:panelFinalizar" />
                                    </p:selectOneMenu>
                                </p:column>

								<p:column headerText="#{sistema.obtenerTexto('gw.alumno.inscripcion.unidadesDidacticasDisponibles.seleccionar')}" styleClass="text-center">
									<p:selectBooleanCheckbox disabled="#{inscripcion.disabled or inscripcion.oportunidades.agotada or not inscripcionBean.contextoInscripcion.permiteInscripcionOmision or inscripcionBean.contextoInscripcion.conclusionEstudios.bloqueaInscripcion}"
										value="#{inscripcion.check}" styleClass="cursor-pointer">
										<p:ajax
											listener="#{inscripcionBean.validarSeleccionMateria(inscripcion)}"
											event="change" update="@this :mainForm:tblEditaComp :pnlMensaje :mainForm:avisoUltimaOportunidad :mainForm:adeudosAdicionales :mainForm:conclusionEstudios :mainForm:avisoOmisionReinscripcion :mainForm:panelFinalizar" />
									</p:selectBooleanCheckbox>
								</p:column>

							</p:dataTable>

						</div>
					</div>
				</div>

				<!-- Sección de términos y condiciones controlada por mostrarTerminosCondiciones -->
				<h:panelGroup
					rendered="#{inscripcionBean.contextoInscripcion.terminosCondiciones.mostrarTerminosCondiciones}">
					<div class="row" style="text-align: center; margin-top: 20px;">
						<p:selectBooleanCheckbox id="chkTerminos"
							value="#{inscripcionBean.aceptaTerminos}">
							<p:ajax event="change" update="panelFinalizar" process="@this" />
						</p:selectBooleanCheckbox>
						<h:outputText value=" #{sistema.obtenerTexto('gw.alumno.inscripcion.aceptar')} " />
						<h:outputLink styleClass="terminos-condiciones"
							value="#{inscripcionBean.contextoInscripcion.terminosCondiciones.enlaceTerminosCondiciones}"
							target="_blank">#{sistema.obtenerTexto('gw.alumno.inscripcion.terminos')}</h:outputLink>
					</div>
				</h:panelGroup>

				<p:outputPanel id="panelFinalizar" styleClass="text-center mt-2" rendered="#{not empty inscripcionBean.contextoInscripcion.estadoAcademico.materiasDisponibles}">
					<p:commandButton id="finalizarBtn"
						disabled="#{(inscripcionBean.contextoInscripcion.terminosCondiciones.mostrarTerminosCondiciones and not inscripcionBean.aceptaTerminos) or (not empty inscripcionBean.contextoInscripcion.mensajeLimiteReprobacionesAlcanzado and not inscripcionBean.contextoInscripcion.permiteInscripcionLimiteReprobadas) or not inscripcionBean.contextoInscripcion.permiteInscripcionOmision or inscripcionBean.contextoInscripcion.conclusionEstudios.bloqueaInscripcion or (not empty inscripcionBean.contextoInscripcion.avisoUltimaOportunidad and not inscripcionBean.contextoInscripcion.aceptaUltimaOportunidad)}"
						value="#{sistema.obtenerTexto('gw.alumno.inscripcion.finalizar')}" update="@form :pnlMensaje"
						action="#{inscripcionBean.finalizarInscripcion}"
						styleClass="btn btn-primary" />
				</p:outputPanel>

			</p:panel>
		</h:form>

		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgValidarSeleccion" header="#{sistema.obtenerTexto('gw.alumno.inscripcion.informativo')}" dynamic="true">
			<p:outputPanel id="pnlMensaje">
				<div class="form-group">
					<div class="row">
						<div class="col-md-12">
							<h:outputText styleClass="bloque"
								value="#{inscripcionBean.mensajeDialog}" />
						</div>
					</div>
				</div>

				<div class="row">
					<div class="col-md-12 text-right">
						<p:commandButton value="#{sistema.obtenerTexto('gw.alumno.inscripcion.modalValidacion.cerrar')}" styleClass="btn btn-default"
							onclick="PF('dlgValidarSeleccion').hide()" />
					</div>
				</div>
			</p:outputPanel>
		</p:dialog>

	</ui:define>


</ui:composition>
