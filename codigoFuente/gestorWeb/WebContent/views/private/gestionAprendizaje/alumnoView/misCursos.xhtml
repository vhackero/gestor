<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">
	<ui:define name="breadcrumb">
		<li class="active">#{sistema.obtenerTexto('gw.alumno.misCursos.titulo')}</li>
	</ui:define>
	<ui:define name="content">
		<h:form id="formMisCursos">
			<p:ajaxStatus onstart="PF('dialogLayout').show()"
				onsuccess="PF('dialogLayout').hide()" />
			<h1>#{sistema.obtenerTexto('gw.alumno.misCursos.titulo')}</h1>
			<hr />
			<p:panel id="misCursos"
				header="#{sistema.obtenerTexto('gw.alumno.misCursos.header')}">
				<div class="row">
					<div class="col-md-12">

						<div class="form-group">
							<div class="row">


								<div class="col-md-3 col-xs-12">
									<h:outputLabel value="#{sistema.obtenerTexto('gw.alumno.misCursos.programaEducativo')}" styleClass="bloque" />
									<h:outputText
										value="#{misCursosBean.tiraMaterias.programaEducativo}">

									</h:outputText>
								</div>

								<div class="col-md-3 col-xs-12">
									<h:outputLabel value="#{sistema.obtenerTexto('gw.alumno.misCursos.matricula')}" styleClass="bloque" />
									<h:outputText value="#{misCursosBean.tiraMaterias.matricula}">

									</h:outputText>
								</div>

							</div>
						</div>


					</div>
				</div>
				<div class="row">
					<div class="col-md-12">
						<p:dataTable id="dtResultadoBusquedaMisCursos"
							emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.sinRegistros')}"
							reflow="true"
							value="#{misCursosBean.tiraMateriasConsolidada}"
							var="participante" paginator="true" rows="10"
							paginatorPosition="bottom"
							paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
							currentPageReportTemplate="({currentPage} de {totalPages})"
							rowsPerPageTemplate="5,10,15" tableStyleClass="table">
							<!-- Nombre del curso -->
							<p:column styleClass="text-center"
								sortBy="#{participante.grupo.evento.nombreEc}">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.alumno.misCursos.columna.asignatura')}" />
								</f:facet>
								<h:outputText
									rendered="#{empty participante.grupo.evento.idEvento or participante.grupo.evento.catModalidadPlanPrograma.id eq 2}"
									value="#{participante.grupo.evento.nombreEc}" />
								<p:commandLink value="#{participante.grupo.evento.nombreEc}"
									rendered="#{not empty participante.grupo.evento.idEvento and not (participante.grupo.evento.catModalidadPlanPrograma.id eq 2)}"
									target="_blank" ajax="false" styleClass="subrayar-con-azul"
									action="#{misCursosBean.navegaUrlCursoLms(participante.grupo.evento.idEvento)}" />
							</p:column>
							<!-- Modalidad -->
							<p:column styleClass="text-center"
								sortBy="#{participante.grupo.evento.catModalidadPlanPrograma.nombre}">
								<f:facet name="header">
									<h:outputText
										value="#{sistema.obtenerTexto('gw.ga.label.modalidad')}" />
								</f:facet>
								<h:outputText
									value="#{empty participante.grupo.evento.catModalidadPlanPrograma.nombre ? '-' : participante.grupo.evento.catModalidadPlanPrograma.nombre}" />
							</p:column>
							<!-- Clave -->
							<p:column styleClass="text-center" sortBy="#{participante.clave}">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.alumno.misCursos.columna.clave')}" />
								</f:facet>
								<h:outputText value="#{empty participante.clave ? '-' : participante.clave}" />
							</p:column>
							<!-- Bloque / Modulo -->
							<p:column styleClass="text-center"
								sortBy="#{participante.bloque}">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.alumno.misCursos.columna.bloque')}" />
								</f:facet>
								<h:outputText value="#{empty participante.bloque ? '-' : participante.bloque}" />
							</p:column>
							<!-- Grupo -->
							<p:column styleClass="text-center"
								sortBy="#{participante.grupo.nombre}">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.alumno.misCursos.columna.grupo')}" />
								</f:facet>
								<h:outputText value="#{empty participante.grupo.nombre ? '-' : participante.grupo.nombre}" />
							</p:column>
							<!-- Docente -->
							<p:column styleClass="text-center"
								sortBy="#{participante.docente}">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.alumno.misCursos.columna.docente')}" />
								</f:facet>
								<h:outputText value="#{empty participante.docente ? '-' : participante.docente}" />
							</p:column>
							<!-- Docente -->
							<p:column styleClass="text-center"
								sortBy="#{participante.asesor}">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.alumno.misCursos.columna.asesor')}" />
								</f:facet>
								<h:outputText value="#{empty participante.asesor ? '-' : participante.asesor}" />
							</p:column>
							<!-- Porcentaje de avance -->
							<p:column styleClass="text-center">
								<f:facet name="header">
									<h:outputText
										value="#{sistema.obtenerTexto('gw.ga.label.porcentajeavance')}" />
								</f:facet>
								<h:outputText value="-"
									rendered="#{empty participante.grupo.evento.idEvento or participante.grupo.evento.catModalidadPlanPrograma.id eq 2}" />
								<p:outputPanel id="avancePanel"
									layout="block"
									rendered="#{not empty participante.grupo.evento.idEvento and not (participante.grupo.evento.catModalidadPlanPrograma.id eq 2)}">
									<p:progressBar id="progressBarAvanceEvento" ajax="true"
										labelTemplate="{value}%"
										rendered="#{misCursosBean.esAvanceDisponible(participante.grupo.evento.idEvento)}"
										value="#{misCursosBean.obtenerAvanceGuardado(participante.grupo.evento.idEvento)}"
										displayOnly="true" style="width:100%" styleClass="pull-right" />
									<h:panelGroup layout="block" styleClass="text-center"
										rendered="#{misCursosBean.esAvanceConError(participante.grupo.evento.idEvento)}">
										<h:outputText value="No se pudo cargar el avance." />
										<br />
										<p:commandLink value="Reintentar" process="@this"
											onclick="cargarAvance_#{participante.grupo.evento.idEvento}(); return false;" />
									</h:panelGroup>
									<h:panelGroup layout="block" styleClass="text-center"
										rendered="#{misCursosBean.esAvancePendiente(participante.grupo.evento.idEvento)}">
										<i class="fa fa-spinner fa-spin"></i>
									</h:panelGroup>
									<p:remoteCommand name="cargarAvance_#{participante.grupo.evento.idEvento}"
										actionListener="#{misCursosBean.cargarAvanceOaAjax(participante.grupo.evento.idEvento)}"
										process="@this"
										update="@parent"
										global="false" async="true"
										rendered="#{misCursosBean.esAvancePendiente(participante.grupo.evento.idEvento) or misCursosBean.esAvanceConError(participante.grupo.evento.idEvento)}"
										autoRun="#{misCursosBean.esAvancePendiente(participante.grupo.evento.idEvento)}" />
								</p:outputPanel>
							</p:column>
							<!-- Encuesta final -->
							<p:column styleClass="text-center">
								<f:facet name="header">
									<h:outputText
										value="#{sistema.obtenerTexto('gw.ga.label.encuestafinal')}" />
								</f:facet>
								<h:outputText value="-" rendered="#{empty participante.grupo.evento.idEvento}" />
								<p:commandLink process="@this" style="opacity:1;"
									rendered="#{not empty participante.grupo.evento.idEvento}"
									styleClass="#{misCursosBean.obtenerEstatusEncuestaEvtEnEjec(participante.grupo.evento) eq 'Contestar' ? 'subrayar-con-azul' : ''}"
									action="#{consultarEncuestaUsuarioBean.navegaConsultarEncuestaUsuario}"
									disabled="#{misCursosBean.esEncuestaVisibleEvtEnEje(participante.grupo.evento.idEvento)}"
									value="#{misCursosBean.obtenerEstatusEncuestaEvtEnEjec(participante.grupo.evento)}">
									<f:setPropertyActionListener
										target="#{consultarEncuestaUsuarioBean.idEvento}"
										value="#{participante.grupo.evento.idEvento}" />
									<f:setPropertyActionListener
										target="#{consultarEncuestaUsuarioBean.idTipoEncuesta}"
										value="#{misCursosBean.tipoEncuestaSeleccionado.id}" />
								</p:commandLink>
							</p:column>
							<!-- Finaliza -->
							<p:column styleClass="text-center"
								sortBy="#{participante.grupo.evento.fechaFinal}">
								<f:facet name="header">
									<h:outputText
										value="#{sistema.obtenerTexto('gw.ga.label.finaliza')}" />
								</f:facet>
								<h:outputText value="-" rendered="#{empty participante.grupo.evento.fechaFinal}" />
								<h:outputText value="#{participante.grupo.evento.fechaFinal}"
									rendered="#{not empty participante.grupo.evento.fechaFinal}">
									<f:convertDateTime type="date"
										pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}" />
								</h:outputText>
							</p:column>
						</p:dataTable>
						<div class="row">
							<div class="col-md-12">
								<h:outputText
									value="#{sistema.obtenerTexto('gw.ga.label.leyendaseguimientoeventoscap')}" />
							</div>
						</div>
						<div class="row">
							<div class="col-md-3 col-md-offset-9">
								<p:selectOneMenu id="estatus"
									value="#{misCursosBean.idEstatusSeleccionado}"
									requiredMessage="#{sistema.obtenerTexto('gw.global.msg.dato.req')}"
									valueChangeListener="#{misCursosBean.onChangeEstatuEc}"
									styleClass="col-xs-12">
									<p:ajax event="change" process="@this"
										update="dtResultadoBusquedaMisCursosEstatus" />
									<f:selectItem
										itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
									<f:selectItems
										value="#{misCursosBean.catEstadoEventoCapacitacionList}"
										var="estatus" itemValue="#{estatus.id}"
										itemLabel="#{estatus.nombre}" />
								</p:selectOneMenu>
							</div>
						</div>
						
						<div class="row">
							<div class="col-md-12">
								<p:dataTable id="dtResultadoBusquedaMisCursosEstatus"
									emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.sinRegistros')}"
									reflow="true" value="#{misCursosBean.eventoCapacitacionList}"
									var="evento" paginator="true" rows="10"
									paginatorPosition="bottom"
									paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
									currentPageReportTemplate="({currentPage} de {totalPages})"
									rowsPerPageTemplate="5,10,15" tableStyleClass="table">
									<!-- Nombre del curso -->
									<p:column styleClass="text-center">
										<f:facet name="header">
											<h:outputText value="Nombre de la asignatura" />
										</f:facet>
										<h:outputText value="#{evento.nombreEc}" />
									</p:column>
									<!-- Modalidad -->
									<p:column styleClass="text-center">
										<f:facet name="header">
											<h:outputText
												value="#{sistema.obtenerTexto('gw.ga.label.modalidad')}" />
										</f:facet>
										<h:outputText
											value="#{evento.catModalidadPlanPrograma.nombre}" />
									</p:column>
									<!-- Seguimiento de desarrollo de competencias -->
									<p:column styleClass="text-center" rendered="true">
										<f:facet name="header">
											<h:outputText
												value="#{sistema.obtenerTexto('gw.ga.label.seguimientodesacomp')}" />
										</f:facet>
										<p:commandLink process="@this"
											action="#{consultarEncuestaUsuarioBean.navegaConsultarEncuestaUsuario}"
											disabled="#{misCursosBean.esEncuestaVisibleEvtConc(evento.idEvento)}"
											value="#{sistema.obtenerTexto(misCursosBean.obtenerEstatusEncuestaEvtConc(evento.idEvento))}">
											<f:setPropertyActionListener
												target="#{consultarEncuestaUsuarioBean.idEvento}"
												value="#{participante.grupo.evento.idEvento}" />
											<f:setPropertyActionListener
												target="#{consultarEncuestaUsuarioBean.idTipoEncuesta}"
												value="#{null}" />
										</p:commandLink>
									</p:column>
									<!--Fecha  Limite -->
									<p:column styleClass="text-center">
										<f:facet name="header">
											<h:outputText
												value="#{sistema.obtenerTexto('gw.ga.label.fechaLimite')}" />
										</f:facet>
										<h:outputText
											value="#{misCursosBean.obtenerFechaLimiteEncuesta(evento.idEvento)}">
											<f:convertDateTime type="date"
												pattern="#{sistema.obtenerTexto('gw.textos.menu.formatoFecha')}" />
										</h:outputText>
									</p:column>
								</p:dataTable>
							</div>
						</div>

						<div class="row">
							<div class="col-md-12">
								<p:dataTable id="dtResultadoBusquedaMisCursosEstatus2"
									emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.sinRegistros')}"
									reflow="true" value="#{misCursosBean.tiraMateriasBaja}"
									var="evento" paginator="true" rows="10"
									paginatorPosition="bottom"
									paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
									currentPageReportTemplate="({currentPage} de {totalPages})"
									rowsPerPageTemplate="5,10,15" tableStyleClass="table">
									
									<!-- Nombre Materia -->
									<p:column styleClass="text-center">
										<f:facet name="header">
											<h:outputText
												value="Nombre de las asignarturas" />
										</f:facet>
										<h:outputText
											value="#{evento.nombreMateria}" />
									</p:column>
									<!-- Periodo -->
									<p:column styleClass="text-center">
										<f:facet name="header">
											<h:outputText value="Periodo" />
										</f:facet>
										<h:outputText value="#{evento.periodo}" />
									</p:column>
									<!--Tipo Baja -->
									<p:column styleClass="text-center">
										<f:facet name="header">
											<h:outputText value="Tipo de baja" />
										</f:facet>
										<h:outputText value="#{evento.tipoBaja}" />
									</p:column>
								</p:dataTable>
							</div>
						</div>

					</div>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
