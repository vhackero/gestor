<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">



	<p:panel header="Nueva Convocatoria">



		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque" value="Convocatoria:" />

					<p:selectOneMenu id="convocatoria"
						styleClass="col-xs-12">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{dispersionesBean.listaConvocatoria}"
							var="modalidad" itemLabel="#{modalidad.nombre}"
							itemValue="#{modalidad.convocatoriaId}" />
					</p:selectOneMenu>

				</div>
				
				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Tipo de proceso de inscripción:" />
					<p:selectOneMenu id="tipoInscripcion"
						value="#{convocatoriasBean.convocatoriaParamNueva.altaEstatus}"
						styleClass="col-xs-12" required="true"
						requiredMessage="El estatus es obligatorio.">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{convocatoriasBean.estatusLista}"
							var="modalidad" itemLabel="#{modalidad.nombreEstatus}"
							itemValue="#{modalidad.valorEstatus}" />

					</p:selectOneMenu>
					<p:message for="tipoInscripcion" display="text" />
				</div>
				
				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Proceso de inscripción:" />
					<p:selectOneMenu id="procesoInscripcion"
						value="#{convocatoriasBean.convocatoriaParamNueva.altaEstatus}"
						styleClass="col-xs-12" required="true"
						requiredMessage="El estatus es obligatorio.">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{convocatoriasBean.estatusLista}"
							var="modalidad" itemLabel="#{modalidad.nombreEstatus}"
							itemValue="#{modalidad.valorEstatus}" />

					</p:selectOneMenu>
					<p:message for="procesoInscripcion" display="text" />
				</div>

			</div>
		</div>
		
		
		
		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Tipo de matriculación:" />
					<p:selectOneMenu id="tipoMatriculacion"
						value="#{convocatoriasBean.convocatoriaParamNueva.altaEstatus}"
						styleClass="col-xs-12" required="true"
						requiredMessage="El estatus es obligatorio.">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{convocatoriasBean.estatusLista}"
							var="modalidad" itemLabel="#{modalidad.nombreEstatus}"
							itemValue="#{modalidad.valorEstatus}" />

					</p:selectOneMenu>
					<p:message for="convocatoria" display="text" />
				</div>
				
				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Plan:" />
					<p:selectOneMenu id="plan"
						value="#{convocatoriasBean.convocatoriaParamNueva.altaEstatus}"
						styleClass="col-xs-12" required="true"
						requiredMessage="El estatus es obligatorio.">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{convocatoriasBean.estatusLista}"
							var="modalidad" itemLabel="#{modalidad.nombreEstatus}"
							itemValue="#{modalidad.valorEstatus}" />

					</p:selectOneMenu>
					<p:message for="tipoInscripcion" display="text" />
				</div>
				
				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Programa:" />
					<p:selectOneMenu id="programa"
						value="#{convocatoriasBean.convocatoriaParamNueva.altaEstatus}"
						styleClass="col-xs-12" required="true"
						requiredMessage="El estatus es obligatorio.">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{convocatoriasBean.estatusLista}"
							var="modalidad" itemLabel="#{modalidad.nombreEstatus}"
							itemValue="#{modalidad.valorEstatus}" />

					</p:selectOneMenu>
					<p:message for="procesoInscripcion" display="text" />
				</div>

			</div>
		</div>



		<div class="form-group">
			<div class="row">

				<div class="col-md-12 text-right">

					<p:commandButton value="Cancelar" process="@this" update="@form"
						action="#{convocatoriasBean.cancelar}" ajax="true"
						styleClass="btn btn-default" />

					<p:commandButton value="Limpiar campos" process="@this"
						update="@form" action="#{convocatoriasBean.limpiarCampos}"
						ajax="true" styleClass="btn btn-default" />


					<p:commandButton id="btnBusquedaAvas" process="@form" ajax="true"
						update="@form" styleClass="btn btn-primary pull-right"
						action="#{convocatoriasBean.altaConvocatorias}" value="Guardar" />



				</div>
			</div>
		</div>


	</p:panel>

	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgValidarSeleccion8" header="Informativo" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
					<h:outputText styleClass="bloque"
						value="Ingrese los datos marcados como obligatorios." />
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12 text-right">
				<p:commandButton value="Cerrar" styleClass="btn btn-default"
					onclick="PF('dlgValidarSeleccion8').hide()" />
			</div>
		</div>
	</p:dialog>

	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgValidarSeleccion9" header="Informativo" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
					<h:outputText styleClass="bloque"
						value="Convocatoria generada exitosamente." />
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12 text-right">
				<p:commandButton value="Cerrar" styleClass="btn btn-default"
					onclick="PF('dlgValidarSeleccion9').hide()" />
			</div>
		</div>
	</p:dialog>

</ui:composition>
