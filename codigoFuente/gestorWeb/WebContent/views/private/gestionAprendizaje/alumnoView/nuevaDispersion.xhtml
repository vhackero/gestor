<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">



	<p:panel header="Nuevo proceso de dispersión">



		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Convocatoria:" />

					<p:selectOneMenu id="convocatoria" required="true"  value="#{dispersionesBean.dispercionParametros.idConvocatoriaSeleccionada}"
                    			 requiredMessage="La convocatoria es obligatorio." styleClass="col-xs-12">
						<p:ajax event="change" process="@this" update="@form"
											listener="#{dispersionesBean.consultarPlan}" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{dispersionesBean.listaConvocatoria}"
							var="modalidad" itemLabel="#{modalidad.convocatoriaId}"
							itemValue="#{modalidad.convocatoriaId}" />
					</p:selectOneMenu>
					<p:message for="convocatoria" display="text" />

				</div>
				
				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Tipo de proceso de inscripción:" />
					<p:selectOneMenu id="tipoProceso" required="true"  value="#{dispersionesBean.dispercionParametros.idTipoProceso}"
                    			 requiredMessage="El tipo de proceso es obligatorio."
						styleClass="col-xs-12">
						<p:ajax event="change" process="@this" update="@form"
											listener="#{dispersionesBean.consultarProcesoInscripcion}" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{dispersionesBean.listaTipoProceso}"
							var="modalidad" itemLabel="#{modalidad.idProceso}"
							itemValue="#{modalidad.idProceso}" />
					</p:selectOneMenu>
					<p:message for="tipoProceso" display="text" />
					
				</div>
				
				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Proceso de inscripción:" />
					<p:selectOneMenu id="procesoInscripcion" required="true" value="#{dispersionesBean.dispercionParametros.idProcesoInscripcion}"
                    			 requiredMessage="El proceso es obligatorio."
						styleClass="col-xs-12">
						<p:ajax event="change" process="@this"
											listener="#{dispersionesBean.consultarProcesoInscripcion}" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{dispersionesBean.listaProcesosInscripcion}"
							var="modalidad" itemLabel="#{modalidad.idProcesoInscripcion}"
							itemValue="#{modalidad.idProcesoInscripcion}" />
					</p:selectOneMenu>
					<p:message for="procesoInscripcion" display="text" />
				</div>

			</div>
		</div>
		
		
		
		<div class="form-group">
			<div class="row">

				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Tipo de matriculación:" />
					<p:selectOneMenu id="tipoMatricula" required="true" value="#{dispersionesBean.dispercionParametros.idTipoMatriculacion}"
                    			 requiredMessage="El tipo de matriculacion es obligatorio."
						styleClass="col-xs-12">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{dispersionesBean.listaTipoMatriculacion}"
							var="modalidad" itemLabel="#{modalidad.nombre}"
							itemValue="#{modalidad.idTipoMatriculacion}" />
					</p:selectOneMenu>
					<p:message for="tipoMatricula" display="text" />
				</div>
				
				<div class="col-md-4 col-xs-12">

					<p:outputLabel styleClass="bloque requerido" value="Plan:" rendered="#{dispersionesBean.mostrarPlanYPrograma}" />
					<p:selectOneMenu id="plan" rendered="#{dispersionesBean.mostrarPlanYPrograma}"
						value="#{dispersionesBean.dispercionParametros.idPlan}"
						styleClass="col-xs-12" required="true"
						requiredMessage="El estatus es obligatorio.">
						<p:ajax event="change" process="@this" update="@form"
											listener="#{dispersionesBean.consultarPrograma}" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{dispersionesBean.listaPlanes}"
							var="modalidad" itemLabel="#{modalidad.nombre}"
							itemValue="#{modalidad.idPlan}" />

					</p:selectOneMenu>
				</div>
				
				<div class="col-md-4 col-xs-12" >

					<p:outputLabel styleClass="bloque requerido" value="Programa:" rendered="#{dispersionesBean.mostrarPlanYPrograma}" />
					<p:selectOneMenu id="programa" rendered="#{dispersionesBean.mostrarPlanYPrograma}"
						value="#{dispersionesBean.dispercionParametros.idPrograma}"
						styleClass="col-xs-12" required="true"
						requiredMessage="El estatus es obligatorio.">
						<p:ajax event="change" process="@this" />
						<f:selectItem
							itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
							itemValue="#{null}" />
						<f:selectItems value="#{dispersionesBean.listaPrograma}"
							var="modalidad" itemLabel="#{modalidad.nombreTentativo}"
							itemValue="#{modalidad.idPrograma}" />

					</p:selectOneMenu>
					<p:message for="procesoInscripcion" display="text" />
				</div>

			</div>
		</div>



		<div class="form-group">
			<div class="row">

				<div class="col-md-12 text-right">

					<p:commandButton value="Cancelar" process="@this" update="@form"
						action="#{convocatoriasBean.cancelar}" ajax="true"
						styleClass="btn btn-default" />

					<p:commandButton value="Limpiar campos" process="@this"
						update="@form" action="#{dispersionesBean.limpiarCampos}"
						ajax="true" styleClass="btn btn-default" />


					<p:commandButton id="btnBusquedaAvas" process="@form" ajax="true"
						update="@form" styleClass="btn btn-primary pull-right"
						action="#{dispersionesBean.altaDisperciones}" value="Guardar" />



				</div>
			</div>
		</div>


	</p:panel>

	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgValidarSeleccion8" header="Informativo" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
					<h:outputText styleClass="bloque"
						value="Ingrese los datos marcados como obligatorios." />
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12 text-right">
				<p:commandButton value="Cerrar" styleClass="btn btn-default"
					onclick="PF('dlgValidarSeleccion8').hide()" />
			</div>
		</div>
	</p:dialog>

	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgValidarSeleccion1" header="Informativo" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
					<h:outputText styleClass="bloque"
						value="Inscripcion generada exitosamente." />
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12 text-right">
				<p:commandButton value="Cerrar" styleClass="btn btn-default"
					onclick="PF('dlgValidarSeleccion1').hide()" />
			</div>
		</div>
	</p:dialog>
	
	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgValidarSeleccion2" header="Informativo" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
					<h:outputText styleClass="bloque"
						value="Ya existen registros asociados." />
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12 text-right">
				<p:commandButton value="Cerrar" styleClass="btn btn-default"
					onclick="PF('dlgValidarSeleccion2').hide()" />
			</div>
		</div>
	</p:dialog>
	
	<p:dialog appendTo="@(body)" draggable="false" position="center"
		resizable="false" closable="false" modal="true" width="600px"
		widgetVar="dlgValidarSeleccion3" header="Informativo" dynamic="true">
		<div class="form-group">
			<div class="row">
				<div class="col-md-12">
					<h:outputText styleClass="bloque"
						value="'Para poder crear un proceso extraordinario primero se debe crear un proceso ordinario." />
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-12 text-right">
				<p:commandButton value="Cerrar" styleClass="btn btn-default"
					onclick="PF('dlgValidarSeleccion3').hide()" />
			</div>
		</div>
	</p:dialog>

</ui:composition>
