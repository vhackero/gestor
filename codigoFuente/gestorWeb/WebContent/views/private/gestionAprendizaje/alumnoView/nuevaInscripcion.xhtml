	<p:panel header="Nuevo Proceso de Inscripción" rendered="#{inscripocionesBean.mostrarConsultaConvocatoria}">

			<div class="form-group">
				<div class="row">

					<!-- Convocatoria - Select -->
					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque requerido" for="convocatoria"
							value="Convocatoria:" />
						<p:selectOneMenu id="convocatoria"
							value="#{inscripocionesBean.inscripcionParamNueva.convocatoriaSeleccionada}" required="true"
                				 requiredMessage="El campo convocatoria es requerido" >

							<!-- Llamar al método cuando cambia la selección -->
							<p:ajax event="change"
								listener="#{inscripocionesBean.onConvocatoriaSeleccionada}"
								update="@form" />

							<!-- Opciones del Select -->
							<f:selectItem itemLabel="Seleccionar" itemValue="#{null}" />
							<f:selectItems value="#{inscripocionesBean.listaConvocatoria}"
								var="convocatoria" itemLabel="#{convocatoria.nombre}"
								itemValue="#{convocatoria.convocatoriaId}" />
						</p:selectOneMenu>
						<p:message for="convocatoria" display="text" />
					</div>
					<!-- Tipo de proceso - Select -->
					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque requerido" for="tipoProceso"
							value="Tipo de proceso:" />
						<p:selectOneMenu id="tipoProceso"
							value="#{inscripocionesBean.inscripcionParamNueva.procesoSeleccionada}" required="true"
                				 requiredMessage="El campo tipo proceso es requerido" >
							<!-- Llamar al método cuando cambia la selección -->
							<p:ajax event="change"
								listener="#{inscripocionesBean.onTipoProcesoChange}"
								update="@form" />

							<!-- Opciones del Select -->
							<f:selectItem itemLabel="Seleccionar" itemValue="#{null}" />
							<f:selectItems value="#{inscripocionesBean.listaTipoProceso}"
								var="tipoProceso" itemLabel="#{tipoProceso.nombre}"
								itemValue="#{tipoProceso.idProceso}" />
						</p:selectOneMenu>
					<p:message for="tipoProceso" display="text" />
					<h:outputText styleClass="bloque"
						value="No hay tipos de proceso disponibles para la convocatoria seleccionada."
						rendered="#{inscripocionesBean.sinTiposProcesoDisponibles}" />
				</div>

					<!-- Nombre - Input -->
					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque requerido" for="nombre" value="Nombre:" />
						<p:inputText id="nombre" value="#{inscripocionesBean.inscripcionParamNueva.nombre}"
							styleClass="form-control" required="true"
                				 requiredMessage="El campo nombre es requerido">
							<p:ajax event="blur" listener="#{inscripocionesBean.sugerirClaveProceso}" update="@form" />
						</p:inputText>
						<p:message for="nombre" display="text" />
					</div>



				</div>
			</div>

			<div class="form-group">
				<div class="row">
					<!-- Clave de proceso - Input -->
					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque" for="claveProceso"
							value="Clave de proceso:" />
						<p:inputText id="claveProceso" value="#{inscripocionesBean.inscripcionParamNueva.calveProceso}"
							styleClass="form-control" />
					</div>
					<!-- Descripción - Input -->
					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque" for="descripcion"
							value="Descripción:" />
						<p:inputTextarea id="descripcion"
							value="#{inscripocionesBean.inscripcionParamNueva.descripcion}" styleClass="form-control"
							rows="3" />
					</div>
					<!-- Semestre - Select -->
					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque" for="semestre"
							value="Semestre:" />
						<p:selectOneMenu id="semestre" value="#{inscripocionesBean.inscripcionParamNueva.semestre}"
							styleClass="col-xs-12">
							<f:selectItem itemLabel="Seleccionar" itemValue="#{null}" />
							<f:selectItems value="#{inscripocionesBean.listaSemestres}"
								var="semestre" itemLabel="#{semestre}"
								itemValue="#{semestre}" />
						</p:selectOneMenu>
					</div>

				</div>
			</div>

			<div class="form-group">
				<div class="row">



					<!-- Fecha inicio - Input -->
					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque requerido" for="fechaInicio"
							value="Fecha inicio:" />
						<p:calendar id="fechaInicio" value="#{inscripocionesBean.inscripcionParamNueva.fechaInicio}"
							pattern="dd/MM/yyyy" locale="es" showOn="button" navigator="true"
							readonlyInput="true" yearRange="c-100:c+100"
							placeholder="Seleccionar" required="true"
                				 requiredMessage="El campo fecha inicio es requerido"/>
                				 <p:message for="fechaInicio" display="text" />
					</div>

					<!-- Fecha fin - Input -->
					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque requerido" for="fechaFin"
							value="Fecha fin:" />
						<p:calendar id="fechaFin" value="#{inscripocionesBean.inscripcionParamNueva.fechaFin}"
							pattern="dd/MM/yyyy" locale="es" showOn="button" navigator="true"
							readonlyInput="true" yearRange="c-100:c+100"
							placeholder="Seleccionar" required="true"
                				 requiredMessage="El campo fecha fin es requerido"/>
                				 <p:message for="fechaFin" display="text" />
					</div>
					
					<div class="col-md-4 col-xs-12">

							<p:outputLabel styleClass="bloque" value="Estatus:" />
							<p:selectOneMenu id="altaEstatus"  value="#{inscripocionesBean.inscripcionParamNueva.altaEstatus}"
								styleClass="col-xs-12" >
								<p:ajax event="change" process="@this" />
								<f:selectItem
									itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
									itemValue="#{null}" />
								<f:selectItems value="#{inscripocionesBean.estatusLista}"
									var="modalidad" itemLabel="#{modalidad.nombreEstatus}"
									itemValue="#{modalidad.valorEstatus}" />

							</p:selectOneMenu>
							 <p:message for="altaEstatus" display="text" />
						</div>

				</div>
			</div>

			<div class="form-group">
				<div class="row">

					<div class="col-md-4 col-xs-12">
						<p:outputLabel styleClass="bloque" for="perfil" value="Perfil:" />
							<p:inputText id="perfil" value="#{inscripocionesBean.inscripcionParamNueva.perfil}"
								styleClass="form-control" maxlength="10" />
					</div>


				</div>
			</div>
			<div class="form-group">
			<div class="row">
				<div class="col-md-12 text-right">
					<p:commandButton value="Cancelar" process="@this"
										 update="@form"
										 action="#{inscripocionesBean.cancelar}" ajax="true"
										 styleClass="btn btn-default" />
						<p:commandButton value="Limpiar campos" process="@this"
										 update="@form"
										 action="#{inscripocionesBean.limpiarCampos}" ajax="true"
										 styleClass="btn btn-default" />				
						<p:commandButton id="btnBusquedaAvas" process="@form" ajax="true"
							update="@form" styleClass="btn btn-primary pull-right"
							action="#{inscripocionesBean.altaInscripcion}"
							value="Guardar" />
				</div>
			</div>
		</div>

	</p:panel>
