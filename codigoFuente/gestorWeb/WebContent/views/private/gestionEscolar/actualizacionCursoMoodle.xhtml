<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="breadcrumb">
		<li>#{sistema.obtenerTexto('gw.gestionescolar.label.gestionEscolar')}</li>
		<li class="active">#{sistema.obtenerTexto('gw.sidebar.actualizacionCursoMoodle')}</li>
	</ui:define>

	<ui:define name="content">
		<h:form id="frmActualizacionCursoMoodle" enctype="multipart/form-data">
			<style type="text/css">
				.actualizacion-moodle-loader {
					padding: 18px 28px;
					text-align: center;
					min-width: 260px;
				}

				.actualizacion-moodle-loader-icon {
					width: 38px;
					height: 38px;
					margin: 0 auto 12px;
					border: 4px solid #e5e5e5;
					border-top-color: #337ab7;
					border-radius: 50%;
					animation: actualizacionMoodleSpin 0.9s linear infinite;
				}

				.actualizacion-moodle-loader-text {
					font-weight: 600;
					color: #333;
				}

				@keyframes actualizacionMoodleSpin {
					from {
						transform: rotate(0deg);
					}
					to {
						transform: rotate(360deg);
					}
				}
			</style>

			<h1>#{sistema.obtenerTexto('gw.sidebar.actualizacionCursoMoodle')}</h1>
			<hr />

			<p:messages id="msgs" closable="true" showDetail="true" severity="info,warn,error,fatal" />

			<p:dialog widgetVar="dlgProcesandoActualizacionMoodle" modal="true" closable="false"
				draggable="false" resizable="false" showHeader="false" appendToBody="true">
				<div class="actualizacion-moodle-loader">
					<div class="actualizacion-moodle-loader-icon"></div>
					<div class="actualizacion-moodle-loader-text">Procesando solicitud...</div>
				</div>
			</p:dialog>

			<p:panel header="Búsqueda" styleClass="panel-default">
				<div class="row">
					<div class="col-md-3 col-xs-12">
						<p:outputLabel for="plan" styleClass="requerido" value="Plan:" />
						<p:selectOneMenu id="plan" style="width:100%;"
							value="#{actualizacionCursoMoodleBean.idPlanSeleccionado}">
							<p:ajax event="change" listener="#{actualizacionCursoMoodleBean.onPlanChange}"
								process="@this" update="programa tablaResultados msgs" />
							<f:selectItem itemLabel="Seleccionar" itemValue="#{null}" />
							<f:selectItems value="#{actualizacionCursoMoodleBean.planes}" />
						</p:selectOneMenu>
					</div>
					<div class="col-md-3 col-xs-12">
						<p:outputLabel for="programa" styleClass="requerido" value="Programa:" />
						<p:selectOneMenu id="programa" style="width:100%;"
							value="#{actualizacionCursoMoodleBean.idProgramaSeleccionado}">
							<f:selectItem itemLabel="Seleccionar" itemValue="#{null}" />
							<f:selectItems value="#{actualizacionCursoMoodleBean.programas}" />
						</p:selectOneMenu>
					</div>
					<div class="col-md-3 col-xs-12">
						<p:outputLabel for="anioPeriodo" styleClass="requerido" value="Año periodo:" />
						<p:selectOneMenu id="anioPeriodo" style="width:100%;"
							value="#{actualizacionCursoMoodleBean.anioPeriodoSeleccionado}">
							<f:selectItem itemLabel="Seleccionar" itemValue="#{null}" />
							<f:selectItems value="#{actualizacionCursoMoodleBean.aniosPeriodo}" />
						</p:selectOneMenu>
					</div>
					<div class="col-md-3 col-xs-12">
						<p:outputLabel for="numeroElementos" styleClass="requerido" value="Número de elementos:" />
						<p:selectOneMenu id="numeroElementos" style="width:100%;"
							value="#{actualizacionCursoMoodleBean.numeroElementosSeleccionado}">
							<f:selectItem itemLabel="Seleccionar" itemValue="#{null}" />
							<f:selectItems value="#{actualizacionCursoMoodleBean.numerosElementos}" />
						</p:selectOneMenu>
					</div>
				</div>
				<div class="row" style="margin-top: 18px;">
					<div class="col-md-12 text-right">
						<p:commandButton value="Limpiar" styleClass="btn btn-default"
							actionListener="#{actualizacionCursoMoodleBean.limpiar}" update="@form" process="@this" />
						<p:commandButton value="Buscar" styleClass="btn btn-primary"
							style="margin-left: 10px;"
							actionListener="#{actualizacionCursoMoodleBean.buscar}" update="@form" process="@form" />
					</div>
				</div>
			</p:panel>

			<p:spacer height="15" />

			<p:panel header="Respaldo del curso" styleClass="panel-default">
				<div class="row">
					<div class="col-md-9 col-xs-12">
						<h:outputText value="Seleccionar archivo (.mbz)" styleClass="bloque" />
						<p:fileUpload mode="simple" value="#{actualizacionCursoMoodleBean.archivoCurso}"
							allowTypes="/(\\.|\\/)(mbz)$/i" />
					</div>
					<div class="col-md-3 col-xs-12 text-right" style="margin-top: 24px;">
						<p:commandButton value="Seleccionar" styleClass="btn btn-primary"
							ajax="false"
							actionListener="#{actualizacionCursoMoodleBean.seleccionarArchivo}"
							process="@form" />
					</div>
				</div>
				<h:panelGroup rendered="#{not empty actualizacionCursoMoodleBean.nombreArchivoSeleccionado}" layout="block"
					style="margin-top: 12px; font-weight: 600;">
					<h:outputText value="Archivo seleccionado: #{actualizacionCursoMoodleBean.nombreArchivoSeleccionado}" />
				</h:panelGroup>
			</p:panel>

			<p:spacer height="15" />

			<p:dataTable id="tablaResultados" value="#{actualizacionCursoMoodleBean.resultados}" var="resultado"
				tableStyleClass="table" emptyMessage="No hay datos que mostrar">
				<p:column>
					<f:facet name="header">
						<h:outputText value="Evento / Curso" />
					</f:facet>
					<h:outputText value="#{resultado.eventoCurso}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Tipo de asignatura" />
					</f:facet>
					<h:outputText value="#{resultado.tipoAsignatura}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Semestre" />
					</f:facet>
					<h:outputText value="#{resultado.semestre}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="Bloque" />
					</f:facet>
					<h:outputText value="#{resultado.bloque}" />
				</p:column>
				<p:column style="width: 110px; text-align:center;">
					<f:facet name="header">
						<h:outputText value="Seleccionar" />
					</f:facet>
					<p:selectBooleanCheckbox value="#{resultado.seleccionado}"
						disabled="#{not resultado.tieneCursoMoodle}" />
				</p:column>
			</p:dataTable>

			<div class="row" style="margin-top: 20px; margin-bottom: 40px;">
				<div class="col-md-12 text-right">
					<p:commandButton value="Fusionar" styleClass="btn btn-primary"
						actionListener="#{actualizacionCursoMoodleBean.fusionar}" update="msgs"
						process="@form"
						onstart="PF('dlgProcesandoActualizacionMoodle').show();"
						oncomplete="PF('dlgProcesandoActualizacionMoodle').hide();" />
					<p:commandButton value="Reemplazar" styleClass="btn btn-primary"
						style="margin-left: 10px;"
						actionListener="#{actualizacionCursoMoodleBean.reemplazar}" update="msgs"
						process="@form"
						onstart="PF('dlgProcesandoActualizacionMoodle').show();"
						oncomplete="PF('dlgProcesandoActualizacionMoodle').hide();" />
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
