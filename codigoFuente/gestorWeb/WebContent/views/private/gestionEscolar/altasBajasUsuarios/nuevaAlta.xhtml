<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sec="http://www.springframework.org/security/tags">

    <ui:fragment rendered="#{menuGestorBean.rolTienePermiso('ALT_BAJ_USR_ALT')}">
        <sec:authorize access="hasPermission(null, 'ALT_BAJ_USR_ALT') ">
            <h:form id="frmImportar">
                <p:messages id="msgsImportar"
                            autoUpdate="true"
                            closable="true"
                            for="@form" />

                <p:panel header="Importar datos de fuente externa"
                         styleClass="panel-primary">
                    <div class="form-group">
                        <div class="row">
                            <div class="col-md-6 col-sm-6 col-xs-12">
                                <p:outputLabel for="txtMatriculaImportar"
                                               value="* Matricula/Usuario"
                                               styleClass="requerido bloque" />
                                <p:inputText id="txtMatriculaImportar"
                                             styleClass="form-control"
                                             style="width: 100%;" />
                            </div>
                            <div class="col-md-6 col-sm-6 col-xs-12">
                                <p:outputLabel for="somFuenteExterna"
                                               value="* Fuente Externa"
                                               styleClass="requerido bloque" />
                                <p:selectOneMenu id="somFuenteExterna"
                                                 styleClass="col-xs-12"
                                                 style="width: 100%;">
                                    <f:selectItem itemLabel="Seleccionar" itemValue="" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>
                    <div class="row" style="margin-top: 20px;">
                        <div class="col-md-12 text-right">
                            <p:commandButton value="Importar"
                                             type="button"
                                             styleClass="btn btn-primary" />
                        </div>
                    </div>
                </p:panel>
            </h:form>

            <h:form id="frmNuevaAlta">
                <p:messages id="msgsNuevaAlta"
                            autoUpdate="true"
                            closable="true"
                            for="@form" />

                <p:panel header="Nueva alta"
                         styleClass="panel-primary"
                         style="margin-top: 25px;">
                    <div class="form-group">
                        <div class="row">
                            <div class="col-md-4 col-sm-6 col-xs-12">
                                <p:outputLabel for="txtMatriculaNuevaAlta"
                                               value="* Matricula/Usuario"
                                               styleClass="requerido bloque" />
                                <p:inputText id="txtMatriculaNuevaAlta"
                                             styleClass="form-control"
                                             style="width: 100%;" />
                            </div>
                        </div>
                        <div class="row" style="margin-top: 15px;">
                            <div class="col-md-4 col-sm-6 col-xs-12">
                                <p:outputLabel for="somPlanEstudios"
                                               value="* Plan de estudios"
                                               styleClass="requerido bloque" />
                                <p:selectOneMenu id="somPlanEstudios"
                                                 styleClass="col-xs-12"
                                                 style="width: 100%;">
                                    <f:selectItem itemLabel="Seleccionar" itemValue="" />
                                </p:selectOneMenu>
                            </div>
                            <div class="col-md-4 col-sm-6 col-xs-12">
                                <p:outputLabel for="somAsignaturaPrograma"
                                               value="* Asignatura/Programa"
                                               styleClass="requerido bloque" />
                                <p:selectOneMenu id="somAsignaturaPrograma"
                                                 styleClass="col-xs-12"
                                                 style="width: 100%;">
                                    <f:selectItem itemLabel="Seleccionar" itemValue="" />
                                </p:selectOneMenu>
                            </div>
                            <div class="col-md-4 col-sm-6 col-xs-12">
                                <p:outputLabel for="somPeriodo"
                                               value="* Periodo"
                                               styleClass="requerido bloque" />
                                <p:selectOneMenu id="somPeriodo"
                                                 styleClass="col-xs-12"
                                                 style="width: 100%;">
                                    <f:selectItem itemLabel="Seleccionar" itemValue="" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                        <div class="row" style="margin-top: 15px;">
                            <div class="col-md-4 col-sm-6 col-xs-12">
                                <p:outputLabel for="somEvento"
                                               value="* Evento"
                                               styleClass="requerido bloque" />
                                <p:selectOneMenu id="somEvento"
                                                 styleClass="col-xs-12"
                                                 style="width: 100%;">
                                    <f:selectItem itemLabel="Seleccionar" itemValue="" />
                                </p:selectOneMenu>
                            </div>
                            <div class="col-md-4 col-sm-6 col-xs-12">
                                <p:outputLabel for="somGrupo"
                                               value="* Grupo"
                                               styleClass="requerido bloque" />
                                <p:selectOneMenu id="somGrupo"
                                                 styleClass="col-xs-12"
                                                 style="width: 100%;">
                                    <f:selectItem itemLabel="Seleccionar" itemValue="" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>
                    <div class="row" style="margin-top: 20px;">
                        <div class="col-md-6 col-sm-6 col-xs-12">
                            <p:outputLabel value="* Datos obligatorios"
                                           styleClass="requerido" />
                        </div>
                        <div class="col-md-6 col-sm-6 col-xs-12 text-right">
                            <p:commandButton value="Cancelar"
                                             type="button"
                                             styleClass="btn btn-default"
                                             style="margin-right: 10px;" />
                            <p:commandButton value="Matricular"
                                             type="button"
                                             styleClass="btn btn-primary" />
                        </div>
                    </div>
                </p:panel>
            </h:form>
        </sec:authorize>
    </ui:fragment>
</ui:composition>
