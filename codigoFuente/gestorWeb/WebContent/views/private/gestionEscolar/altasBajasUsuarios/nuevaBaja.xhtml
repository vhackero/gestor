<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sec="http://www.springframework.org/security/tags">

    <ui:fragment rendered="#{menuGestorBean.rolTienePermiso('ALT_BAJ_USR_BAJ')}">
        <sec:authorize access="hasPermission(null, 'ALT_BAJ_USR_BAJ') ">
            <h:form id="frmNuevaBaja">
                <p:messages id="msgsNuevaBaja"
                             autoUpdate="true"
                             closable="true"
                             for="@form" />

                <p:panel header="#{sistema.obtenerTexto('gw.gestionescolar.altasbajas.accion.nuevaBaja')}"
                         styleClass="panel-primary">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="matricula" value="Matrícula/Usuario*" />
                                <p:inputText id="matricula"
                                             value="#{nuevaBajaUsuarioBean.matriculaUsuario}"
                                             styleClass="form-control"
                                             required="true"
                                             requiredMessage="La matrícula es obligatoria" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="tipoBaja" value="Tipo de baja*" />
                                <p:selectOneMenu id="tipoBaja"
                                                 value="#{nuevaBajaUsuarioBean.idTipoBaja}"
                                                 styleClass="form-control"
                                                 required="true"
                                                 requiredMessage="Seleccione un tipo de baja">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
                                    <f:selectItems value="#{nuevaBajaUsuarioBean.tiposBaja}" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="plan" value="Plan*" />
                                <p:selectOneMenu id="plan"
                                                 value="#{nuevaBajaUsuarioBean.idPlan}"
                                                 styleClass="form-control"
                                                 required="true"
                                                 requiredMessage="Seleccione un plan">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
                                    <f:selectItems value="#{nuevaBajaUsuarioBean.planes}" />
                                    <p:ajax event="valueChange"
                                            process="@this"
                                            listener="#{nuevaBajaUsuarioBean.onPlanChange}"
                                            update="semestre bloque programa" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="semestre" value="Semestre" />
                                <p:selectOneMenu id="semestre"
                                                 value="#{nuevaBajaUsuarioBean.idSemestre}"
                                                 styleClass="form-control">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
                                    <f:selectItems value="#{nuevaBajaUsuarioBean.semestres}" />
                                    <p:ajax event="valueChange"
                                            process="@this"
                                            listener="#{nuevaBajaUsuarioBean.onSemestreChange}"
                                            update="bloque programa" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="bloque" value="Bloque" />
                                <p:selectOneMenu id="bloque"
                                                 value="#{nuevaBajaUsuarioBean.idBloque}"
                                                 styleClass="form-control">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
                                    <f:selectItems value="#{nuevaBajaUsuarioBean.bloques}" />
                                    <p:ajax event="valueChange"
                                            process="@this"
                                            listener="#{nuevaBajaUsuarioBean.onBloqueChange}"
                                            update="programa" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="programa" value="Asignatura/Programa" />
                                <p:selectOneMenu id="programa"
                                                 value="#{nuevaBajaUsuarioBean.idPrograma}"
                                                 styleClass="form-control">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
                                    <f:selectItems value="#{nuevaBajaUsuarioBean.programas}" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="periodo" value="Periodo" />
                                <p:selectOneMenu id="periodo"
                                                 value="#{nuevaBajaUsuarioBean.idPeriodo}"
                                                 styleClass="form-control">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
                                    <f:selectItems value="#{nuevaBajaUsuarioBean.periodos}" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="evento" value="Evento" />
                                <p:selectOneMenu id="evento"
                                                 value="#{nuevaBajaUsuarioBean.idEvento}"
                                                 styleClass="form-control">
                                    <f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
                                    <f:selectItems value="#{nuevaBajaUsuarioBean.eventos}" />
                                </p:selectOneMenu>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <p:outputLabel for="motivo" value="Motivo" />
                                <p:inputTextarea id="motivo"
                                                value="#{nuevaBajaUsuarioBean.motivo}"
                                                styleClass="form-control"
                                                rows="3" />
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="quien" value="Quién aplica la baja" />
                                <p:inputText id="quien"
                                             value="#{nuevaBajaUsuarioBean.quienAplica}"
                                             styleClass="form-control" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <p:outputLabel for="numero" value="Número de solicitud" />
                                <p:inputText id="numero"
                                             value="#{nuevaBajaUsuarioBean.numeroSolicitud}"
                                             styleClass="form-control" />
                            </div>
                        </div>
                    </div>

                    <div class="row" style="margin-top: 15px;">
                        <div class="col-md-12 text-right">
                            <p:commandButton value="Agregar"
                                             actionListener="#{nuevaBajaUsuarioBean.registrarBaja}"
                                             process="@form"
                                             update="@form"
                                             styleClass="btn btn-primary"
                                             style="margin-right: 10px;" />
                            <p:commandButton value="Cancelar"
                                             action="#{altasBajasUsuariosBean.regresarAlModulo}"
                                             styleClass="btn btn-default"
                                             ajax="false" />
                        </div>
                    </div>
                </p:panel>
            </h:form>
        </sec:authorize>
    </ui:fragment>
</ui:composition>
