<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:sec="http://www.springframework.org/security/tags">

	<ui:define name="breadcrumb">
		<li>#{sistema.obtenerTexto('gw.gestionescolar.label.gestionEscolar')}</li>
		<li>#{sistema.obtenerTexto('gw.gestionescolar.label.eventosCap')}</li>
		<li class="active">#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.titulo')}</li>
	</ui:define>

	<ui:define name="content">
		<h:form id="frmCalif">
			<!-- Panel Datos Generales Evento Capacitacion -->
			<p:ajaxStatus onstart="PF('dialogLayout').show()"
				onsuccess="PF('dialogLayout').hide()" />
			<h1>#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.titulo')}</h1>
			<hr />
			<ui:include src="datosGeneralesEventoCap.xhtml" />

			<p:panel header="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.titulo')}">
				<div class="row">
					<div class="col-md-12">
						<h:outputText
							rendered="#{empty(calificacionGpoEventoCapBean.gruposXEventoCap)}"
							styleClass="textoRojo"
							value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.sinGrupos')}" />
					</div>
				</div>
				<div class="form-group">
					<div class="row">
						<div class="col-md-3">
							<p:outputLabel styleClass="bloque" value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.grupo')}" />
						</div>
						<div class="col-md-3">
							<p:outputLabel
								rendered="#{not (calificacionGpoEventoCapBean.grupoSelec.idGrupo eq 0)}"
								value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.estatusActa')}" />
						</div>
						<div class="col-md-3">
							<p:outputLabel
								rendered="#{calificacionGpoEventoCapBean.grupoSelec.numAlumnosMatriculados eq 0 and not (calificacionGpoEventoCapBean.grupoSelec.idGrupo eq 0)}"
								value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.numeroAlumnos')}" />
						</div>
					</div>
					<div class="row">
						<div class="col-md-3">
							<p:selectOneMenu
								value="#{calificacionGpoEventoCapBean.grupoSelec.idGrupo}"
								styleClass="col-xs-12">
								<p:ajax event="valueChange" update="@form frmCalif" process="@this"
									listener="#{calificacionGpoEventoCapBean.onChangeGpoEC()}" />
								<f:selectItem
									itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
									itemValue="#{0}" />
								<f:selectItems
									value="#{calificacionGpoEventoCapBean.gruposXEventoCap}"
									var="gpoEc" itemLabel="#{gpoEc.nombre}"
									itemValue="#{gpoEc.idGrupo}" />
							</p:selectOneMenu>
						</div>
						<div class="col-md-3">
							<h:outputText
								rendered="#{not (calificacionGpoEventoCapBean.grupoSelec.idGrupo eq 0)}"
								value="#{calificacionGpoEventoCapBean.grupoSelec.actaCerrada eq true ? sistema.obtenerTexto('gw.gestionescolar.calificaciones.acta.cerrada') : sistema.obtenerTexto('gw.gestionescolar.calificaciones.acta.abierta')}"
								styleClass="#{calificacionGpoEventoCapBean.grupoSelec.actaCerrada eq true ? 'textoRojo' : ''}" />
						</div>
						<div class="col-md-3">
							<h:outputText
								rendered="#{calificacionGpoEventoCapBean.grupoSelec.numAlumnosMatriculados eq 0 and not (calificacionGpoEventoCapBean.grupoSelec.idGrupo eq 0)}"
								value="#{(calificacionGpoEventoCapBean.grupoSelec.numAlumnosMatriculados eq 0) ? sistema.obtenerTexto('gw.gestionescolar.calificaciones.sinAlumnos') : calificacionGpoEventoCapBean.grupoSelec.numAlumnosMatriculados }" />
						</div>
					</div>
				</div>

				<p:outputPanel
					rendered="#{calificacionGpoEventoCapBean.grupoSeleccionado}">
					<div class="form-group">
						<div class="row">
							<div class="col-md-3">
								<p:outputLabel styleClass="bloque" value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.docenteLinea')}" />
								<h:outputText
									value="#{calificacionGpoEventoCapBean.encabezadoI.docente}" />
							</div>
							<div class="col-md-3">
								<p:outputLabel styleClass="bloque"
									value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.fechaLimite')}" />
								<h:outputText
									value="#{calificacionGpoEventoCapBean.evento.fechaLimiteLLenado}">
									<f:convertDateTime pattern="dd/MM/yyyy" />
								</h:outputText>
							</div>
							<div class="col-md-3">
								<p:outputLabel styleClass="bloque" value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.numeroEstudiantes')}" />
								<h:outputText
									value="#{calificacionGpoEventoCapBean.grupoSelec.numAlumnosMatriculados eq 0 ? sistema.obtenerTexto('gw.gestionescolar.calificaciones.sinAlumnos') : calificacionGpoEventoCapBean.grupoSelec.numAlumnosMatriculados }" />
							</div>
							<div class="col-md-3">
								<p:outputLabel styleClass="bloque" value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.duracionEvento')}"
									rendered="#{not(calificacionGpoEventoCapBean.modLineaMixto)}" />
								<h:outputText styleClass="margenDerechoMenor"
									rendered="#{not(calificacionGpoEventoCapBean.modLineaMixto)}"
									value="#{calificacionGpoEventoCapBean.duracionEvento}" />
								<h:outputText
									rendered="#{not(calificacionGpoEventoCapBean.modLineaMixto)}"
									value="#{(calificacionGpoEventoCapBean.duracionEvento eq 1)? sistema.obtenerTexto('gw.gestionescolar.calificaciones.dia') : sistema.obtenerTexto('gw.gestionescolar.calificaciones.dias')}" />
							</div>
						</div>
					</div>
					<div class="form-group">
						<div class="row">
							<div class="col-md-3" >
								<p:outputLabel styleClass="bloque" rendered="#{(calificacionGpoEventoCapBean.modLineaMixto and !calificacionGpoEventoCapBean.cerrarActa) or (calificacionGpoEventoCapBean.modLineaMixto and !calificacionGpoEventoCapBean.cerrarActa) }"
									value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.generarEvaluacion.label')}" disabled="#{calificacionGpoEventoCapBean.modalidadEnLinea}"/>
								<p:commandButton process="@this" ajax="true"
									value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.generarEvaluacion.boton')}"
									action="#{calificacionGpoEventoCapBean.generaTablaCalifGrupo}"
									update="@form" styleClass="btn btn-primary" style="margin:0"
									disabled="#{calificacionGpoEventoCapBean.cerrarActa or calificacionGpoEventoCapBean.modalidadEnLinea}"
									rendered="#{(calificacionGpoEventoCapBean.modLineaMixto and !calificacionGpoEventoCapBean.cerrarActa) or (calificacionGpoEventoCapBean.modLineaMixto and !calificacionGpoEventoCapBean.cerrarActa) }" />

								<p:spinner min="0" maxlength="1" max="9" rendered="#{(calificacionGpoEventoCapBean.modLineaMixto and !calificacionGpoEventoCapBean.cerrarActa) or (calificacionGpoEventoCapBean.modLineaMixto and !calificacionGpoEventoCapBean.cerrarActa) }"
									value="#{calificacionGpoEventoCapBean.numEvaluaciones}"
									disabled="#{calificacionGpoEventoCapBean.cerrarActa or calificacionGpoEventoCapBean.modalidadEnLinea}">
									<p:ajax process="@this"
										listener="#{calificacionGpoEventoCapBean.generaTablaCalifGrupo}"
										update="@form" />
									<p:keyFilter regEx="/[0-9]/" preventPaste="false" />
								</p:spinner>
							</div>
							<div class="col-md-8">
								<p:commandButton
									rendered="#{(calificacionGpoEventoCapBean.modLineaMixto and !calificacionGpoEventoCapBean.cerrarActa) or (calificacionGpoEventoCapBean.modLineaMixto and !calificacionGpoEventoCapBean.cerrarActa) }"
									value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.importarCalificaciones')}" process="@this"
									action="#{calificacionGpoEventoCapBean.obtieneCalifMoodleWS}"
									ajax="true" styleClass="btn btn-primary pull-right" style="height: 40px;width: 170px;"
									update="@form" />
								
								<p:commandButton id="btnActaCalificacionesFirmada2" ajax="true"  
									rendered="#{( calificacionGpoEventoCapBean.cerrarActa) }"
									styleClass="btn btn-icon btn-default icono_sisi ss_gn_vis pull-right"
									action="#{calificacionGpoEventoCapBean.descargarActa}" />
								<p:outputLabel value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.descargaActa')}: " 
									styleClass="margenIzquierdo agregaHeight pull-right" 
									rendered="#{(calificacionGpoEventoCapBean.cerrarActa) }"/>

								<sec:authorize access="hasPermission(null, 'ADMIN' ) ">								
									

									<p:outputLabel value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.eliminarActa')}: " 
										styleClass="margenIzquierdo agregaHeight" 
										rendered="#{(calificacionGpoEventoCapBean.tieneRolAdmin and calificacionGpoEventoCapBean.cerrarActa)}"/>
									<p:commandButton id="btnEliminarActaFirmada" ajax="true"  
										rendered="#{(calificacionGpoEventoCapBean.tieneRolAdmin and calificacionGpoEventoCapBean.cerrarActa)}"
										update="@form frmCalif"
										styleClass="btn btn-icon btn-default icono_sisi ss_gn_eliminar"
										action="#{calificacionGpoEventoCapBean.eliminarActa}"/>
								</sec:authorize>	
							</div>
						</div>
					</div>
				</p:outputPanel>

				<p:panel id="pnlCalif" header="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.titulo')}"
					rendered="#{calificacionGpoEventoCapBean.muestraTblCalif}">

					<p:importEnum
						type="mx.gob.sedesol.gestorweb.commons.utils.ECTipoCalificacionEnum"
						var="TPO_CALIF" allSuffix="ALL_ENUM_VALUES" />

					<p:dataTable id="dtCalificaciones" widgetVar="dtCalifGpo"
						emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.msjRegistros')}"
						value="#{calificacionGpoEventoCapBean.tablaAuxCalif}"
						var="partCalif" style="text-align:center;" paginator="true"
						rows="15" paginatorPosition="bottom" reflow="true"
						paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
						currentPageReportTemplate="({currentPage} de {totalPages})"
						rowsPerPageTemplate="5,10,15"
						rendered="#{not empty calificacionGpoEventoCapBean.tablaAuxCalif}"
						tableStyleClass="table" scrollable="true">

						<f:facet name="header">
							<p:outputPanel styleClass="text-right">
								<p:outputLabel for="globalFilter"
									value="#{sistema.obtenerTexto('gw.global.tablas.etiqueta.busqueda')}" />
								<p:inputText id="globalFilter"
									onkeyup="PF('dtCalifGpo').filter()"
									placeholder="#{sistema.obtenerTexto('gw.global.tablas.etiqueta.ayuda')}">
								</p:inputText>
							</p:outputPanel>
						</f:facet>

						<!-- Id del evento de capacitacion -->
							<p:column styleClass="text-center">
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.numero')}" />
								</f:facet>
								<h:outputText value="#{partCalif.consecutivo}" />
							</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText
									value="#{sistema.obtenerTexto('gw.ge.texto.nombre')}" />
							</f:facet>
							<h:outputText value="#{partCalif.participante.nombre}" />
						</p:column>
						<p:column>
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.primerApellido')}" />
								</f:facet>
							<h:outputText value="#{partCalif.participante.apellidoPaterno}" />
						</p:column>
						<p:column>
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.segundoApellido')}" />
								</f:facet>
							<h:outputText value="#{partCalif.participante.apellidoMaterno}" />
						</p:column>

						<p:column>
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.usuario')}" />
								</f:facet>
							<h:outputText value="#{partCalif.participante.usuario}" />
						</p:column>

						<c:forEach items="#{calificacionGpoEventoCapBean.calificaciones}"
							varStatus="indice" var="pc">
							<p:column styleClass="text-center">
								<f:facet name="header">
									<p:outputLabel
										rendered="#{calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1}"
										value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.nombreEvaluacion')}" />
									<h:outputText
										rendered="#{calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1}"
										value="#{pc.nombreEvaluacion}" />
								</f:facet>

								<f:facet name="header">
									<p:inputText id="nombreEvaluacion"
										value="#{pc.nombreEvaluacion}"
										rendered="#{not calificacionGpoEventoCapBean.grupoSelec.actaCerrada eq true}"
										placeholder="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.nombreEvaluacion')}"
										title="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.nombreEvaluacion.titulo')} #{indice.index + 1}"
										styleClass="form-control margenInferior"
										disabled="#{calificacionGpoEventoCapBean.modalidadEnLinea or (calificacionGpoEventoCapBean.grupoSelec.actaCerrada eq true)}">
										<p:ajax process="@this" />
									</p:inputText>
								</f:facet>

								<h:outputText
									rendered="#{calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1}"
									value="#{partCalif.calificacionEC[indice.index].calificacion}" >
									<f:convertNumber pattern="##0" />
								</h:outputText>
								<p:spinner stepFactor="0.25"
									rendered="#{not (calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1)}"
									value="#{partCalif.calificacionEC[indice.index].calificacion}"
									disabled="#{calificacionGpoEventoCapBean.cerrarActa or (calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1) or (calificacionGpoEventoCapBean.grupoSelec.actaCerrada eq true)}"
									size="5" min="#{calificacionGpoEventoCapBean.escalaMin}"
									max="#{calificacionGpoEventoCapBean.escalaMax}">
									<p:ajax update="dtCalificaciones" process="@this"
										listener="#{calificacionGpoEventoCapBean.calculaCalFinalParticipante(partCalif, pc.nombreEvaluacion)}" />
								</p:spinner>
							</p:column>
						</c:forEach>

						<p:column styleClass="text-center">
							<f:facet name="header">
								<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.calificacionTotal')}" />
							</f:facet>
							<h:outputText value="#{partCalif.califTotal}" converter="javax.faces.Integer">
									<f:convertNumber pattern="##0"/>
								</h:outputText>
						</p:column>

						<p:column styleClass="text-center"
							rendered="#{not(calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1)}">
							<f:facet name="header">
								<p:commandLink id="asistLnk" process="@this"
									styleClass="porcentajeAsis" update="@form"
									action="#{registroAsistenciaBean.navegaRegistrarAsistenciasEventoCap()}">
									<f:setPropertyActionListener
										value="#{calificacionGpoEventoCapBean.grupoSelec.evento.idEvento}"
										target="#{registroAsistenciaBean.idEvento}" />
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.asistencia')}" />
								</p:commandLink>
							</f:facet>

							<p:commandLink id="asist" process="@this" update="@form"
								actionListener="#{calificacionGpoEventoCapBean.visualizaAsistenciaUsuario(partCalif.idGpoParticipante)}">
								<u><h:outputText value="#{partCalif.asistencia}" /></u>
								<f:setPropertyActionListener value="#{partCalif}"
									target="#{calificacionGpoEventoCapBean.participanteCalSel}" />
							</p:commandLink>
						</p:column>

						<p:column styleClass="text-center">
							<f:facet name="header">
								<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.calificacionFinal')}" />
							</f:facet>
							<h:outputText value="#{partCalif.califTotal}">
									<f:convertNumber pattern="##0" />
								</h:outputText>
						</p:column>


						<p:column>
							<f:facet name="header">
								<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.dictamen')}" />
							</f:facet>
							<f:validateBean disabled="true">
								<p:selectOneMenu styleClass="col-xs-12"
									value="#{partCalif.dictamen.id}"
									rendered="#{not(calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1)}"
									disabled="#{!(partCalif.conAsistencia) or calificacionGpoEventoCapBean.cerrarActa}">
									<p:ajax process="@this" />
									<f:selectItem
										itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}"
										noSelectionOption="true" />
									<f:selectItems
										value="#{calificacionGpoEventoCapBean.catDictamenes}"
										var="dict" itemLabel="#{dict.nombre}" itemValue="#{dict.id}" />
								</p:selectOneMenu>
							</f:validateBean>
							<h:outputText
								rendered="#{calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1}"
								value="#{calificacionGpoEventoCapBean.obtenerNombreDictamen(partCalif.dictamen.id)}" />
						</p:column>
					</p:dataTable>
					<!-- Tabla oculta para exportación -->
					<p:dataTable id="exportTable"
						value="#{calificacionGpoEventoCapBean.tablaAuxCalif}"
						var="partCalif" rendered="false" style="display:none;">
						<!-- Aquí "tablaAuxCalif" sería tu lista de datos sin elementos editables -->

						<!-- Columnas para la tabla oculta -->
						<p:column>
							<f:facet name="header">
								<h:outputText value="Número" />
							</f:facet>
							<h:outputText value="#{partCalif.consecutivo}" />
						</p:column>

						<p:column>
							<f:facet name="header">
								<h:outputText value="#{sistema.obtenerTexto('gw.ge.texto.nombre')}" />
							</f:facet>
							<h:outputText value="#{partCalif.participante.nombre}" />
						</p:column>

							<p:column>
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.primerApellido')}" />
								</f:facet>
							<h:outputText value="#{partCalif.participante.apellidoPaterno}" />
						</p:column>

						<p:column>
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.segundoApellido')}" />
								</f:facet>
							<h:outputText value="#{partCalif.participante.apellidoMaterno}" />
						</p:column>

						<p:column>
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.usuario')}" />
								</f:facet>
							<h:outputText value="#{partCalif.participante.usuario}" />
						</p:column>
						<c:forEach items="#{calificacionGpoEventoCapBean.calificaciones}"
							varStatus="indice" var="pc">
							<p:column
								rendered="#{calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1}">
								<f:facet name="header">
									<h:outputText value="#{pc.nombreEvaluacion}" />
								</f:facet>
								<h:outputText
									value="#{partCalif.calificacionEC[indice.index].calificacion}" >
									<f:convertNumber pattern="##0" />
								</h:outputText>
							</p:column>

							<p:column
								rendered="#{not (calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1)}">
								<f:facet name="header">
									<h:outputText value="#{pc.nombreEvaluacion}" />
								</f:facet>
								<h:outputText
									value="#{partCalif.calificacionEC[indice.index].calificacion}" />
							</p:column>
						</c:forEach>

						<p:column>
								<f:facet name="header">
									<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.calificacionTotal')}" />
								</f:facet>
							<h:outputText value="#{partCalif.califTotal}" >
									<f:convertNumber pattern="##0" />
								</h:outputText>
						</p:column>

						<p:column
							rendered="#{not(calificacionGpoEventoCapBean.grupoSelec.evento.catModalidadPlanPrograma.id eq 1)}">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.gestionescolar.calificaciones.col.asistencia')}" />
							</f:facet>
