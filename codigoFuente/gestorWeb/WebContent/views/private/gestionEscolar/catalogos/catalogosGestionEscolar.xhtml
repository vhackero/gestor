<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                xmlns:components="http://java.sun.com/jsf/composite/components">

    <ui:define name="breadcrumb">
        <li>#{sistema.obtenerTexto('gw.textos.menu.administracion')}</li>
        <li>#{sistema.obtenerTexto('gw.textos.menu.administracion.catalogos')}</li>
        <li class="active">#{sistema.obtenerTexto('gw.administracion.catalogos.cge')}</li>
    </ui:define>
    <ui:define name="content">
    <h1>#{sistema.obtenerTexto('gw.administracion.catalogos.cge')}</h1>
			<hr />
        <h:form id ="formf">
            <p:ajaxStatus onstart="PF('dialogLayout').show()" onsuccess="PF('dialogLayout').hide()" />

            <div class="row">
                <div class="col-md-4">
                    <p:accordionPanel multiple="true" activeIndex="null" id="acordion" styleClass="acordeoncatalogo">
                        <c:forEach items="#{catGestionEscolarBean.catalogosGestionEscolar}"
                                   var="cat">	
                            <p:tab id="tab#{cat.id}" title="#{cat.nombre}"  >
                                <p:commandLink value="#{sistema.obtenerTexto('gw.gestionescolar.texto.registrar')}" process="@this" id="link#{cat.id}"
                                               action="#{catGestionEscolarBean.generaComponenteReg(cat)}"
                                               update="formf" rendered="#{cat.visualizarReg}" styleClass="bloque"/>
                                <p:commandLink value="#{sistema.obtenerTexto('gw.gestionescolar.texto.visualizar')}" process="@this" id="link2#{cat.id}"
                                               action="#{catGestionEscolarBean.obtenerDatosCatSel(cat)}" update="formf" />
                            </p:tab>
                        </c:forEach>
                    </p:accordionPanel>
                </div>

                <div class="col-md-8" >
                    <components:regCatalogoComun
                            idCat="#{catGestionEscolarBean.idCat}"
                            nombreCat="#{catGestionEscolarBean.nombreCat}"
                            catalogoDTO="#{catGestionEscolarBean.catComunDTOGenerico}"
                            rendered="#{catGestionEscolarBean.muestraCompReg and !catGestionEscolarBean.catalogoPeriodosInscripcion}"
                            accionBtnGuardar="#{catGestionEscolarBean.guardarRegCatalogo}"
                            renderCmpSelect="false" />

                    <p:panel header="#{catGestionEscolarBean.nombreCat}" toggleable="false"
                             rendered="#{catGestionEscolarBean.muestraCompReg and catGestionEscolarBean.catalogoPeriodosInscripcion}">
                        <div class="form-group">
                            <p:outputLabel for="nombrePeriodoInscripcion" styleClass="requerido"
                                           value="#{sistema.obtenerTexto('gw.catComunes.etiqueta.nombre')}" />
                            <p:inputText id="nombrePeriodoInscripcion" required="true" maxlength="45"
                                         requiredMessage="#{sistema.obtenerTexto('gw.global.msg.dato.req')}"
                                         placeholder="#{sistema.obtenerTexto('gw.catComunes.etiqueta.nombre')}"
                                         value="#{catGestionEscolarBean.catComunDTOGenerico.nombre}"
                                         styleClass="form-control" />
                            <p:message for="nombrePeriodoInscripcion" />
                        </div>
                        <div class="form-group">
                            <div class="row">
                                <div class="col-md-6 col-xs-12">
                                    <p:outputLabel for="fechaInicioPeriodo" styleClass="requerido bloque"
                                                   value="Fecha de inicio" />
                                    <p:calendar id="fechaInicioPeriodo" required="true"
                                                requiredMessage="#{sistema.obtenerTexto('gw.global.msg.dato.req')}"
                                                value="#{catGestionEscolarBean.catComunDTOGenerico.fechaInicio}"
                                                pattern="dd/MM/yyyy HH:mm" hourFormat="24" locale="es"
                                                timeZone="#{catGestionEscolarBean.zonaHoraria}"
                                                showOn="button" navigator="true" readonlyInput="true"
                                                yearRange="c-100:c+100" placeholder="Seleccionar" />
                                    <p:message for="fechaInicioPeriodo" />
                                </div>
                                <div class="col-md-6 col-xs-12">
                                    <p:outputLabel for="fechaFinalizacionPeriodo" styleClass="requerido bloque"
                                                   value="Fecha de finalización" />
                                    <p:calendar id="fechaFinalizacionPeriodo" required="true"
                                                requiredMessage="#{sistema.obtenerTexto('gw.global.msg.dato.req')}"
                                                value="#{catGestionEscolarBean.catComunDTOGenerico.fechaFinalizacion}"
                                                pattern="dd/MM/yyyy HH:mm" hourFormat="24" locale="es"
                                                timeZone="#{catGestionEscolarBean.zonaHoraria}"
                                                showOn="button" navigator="true" readonlyInput="true"
                                                yearRange="c-100:c+100" placeholder="Seleccionar" />
                                    <p:message for="fechaFinalizacionPeriodo" />
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="row">
                                <div class="col-md-12 text-right">
                                    <p:commandButton value="#{sistema.obtenerTexto('gw.catComunes.etiqueta.guardar')}"
                                                     action="#{catGestionEscolarBean.guardarRegCatalogo}"
                                                     process="@this nombrePeriodoInscripcion fechaInicioPeriodo fechaFinalizacionPeriodo" ajax="true" update="formf"
                                                     styleClass="btn btn-primary"
                                                     onstart="PF('statusDialog').hide()" />
                                </div>
                            </div>
                        </div>
                    </p:panel>


                    <br />
                    <components:verCatalogoComun
                            idCat="#{catGestionEscolarBean.idCat}"
                            nombreCat="#{catGestionEscolarBean.nombreCat}"
                            listaElemCat="#{catGestionEscolarBean.lstCatSelec}"
                            rendered="#{catGestionEscolarBean.muestraCompTabla and !catGestionEscolarBean.catalogoPeriodosInscripcion}"
                            listenerCambioEstatus="#{catGestionEscolarBean.cambioEstatusCatSelec}"
                            accionEditRegCatalogo="#{catGestionEscolarBean.editaRegCatSeleccionado}"
                            catalogoDTOSel="#{catGestionEscolarBean.catComunDTOGenerico}"
                            renderCmpSelect="false" />

                    <p:panel header="#{catGestionEscolarBean.nombreCat}" toggleable="false"
                             rendered="#{catGestionEscolarBean.muestraCompTabla and catGestionEscolarBean.catalogoPeriodosInscripcion}">
                        <p:dataTable tableStyleClass="table" value="#{catGestionEscolarBean.lstCatSelec}"
                                     var="elemCat" paginator="true" paginatorPosition="bottom"
                                     currentPageReportTemplate="({currentPage} de {totalPages})"
                                     emptyMessage="#{sistema.obtenerTexto('gw.textos.tablas.sinRegistros')}"
                                     paginatorTemplate=" {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     rowsPerPageTemplate="5,10,15" rows="10">
                            <p:column headerText="ID" sortBy="#{elemCat.id}">
                                <h:outputText value="#{elemCat.id}" />
                            </p:column>
                            <p:column headerText="#{sistema.obtenerTexto('gw.admin.vercat.texto.nombre')}"
                                      sortBy="#{elemCat.nombre}">
                                <h:outputText value="#{elemCat.nombre}" />
                            </p:column>
                            <p:column headerText="Fecha de inicio" sortBy="#{elemCat.fechaInicio}">
                                <h:outputText value="#{elemCat.fechaInicio}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm"
                                                       timeZone="#{catGestionEscolarBean.zonaHoraria}" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Fecha de finalización" sortBy="#{elemCat.fechaFinalizacion}">
                                <h:outputText value="#{elemCat.fechaFinalizacion}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm"
                                                       timeZone="#{catGestionEscolarBean.zonaHoraria}" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="#{sistema.obtenerTexto('gw.admin.vercat.texto.acciones')}"
                                      styleClass="text-center">
                                <p:commandButton id="editarPeriodo" styleClass="btn btn-default btn-icon icono_sisi fa fa-solid fa-pen-to-square"
                                                 ajax="true" update="formf" process="@this"
                                                 action="#{catGestionEscolarBean.editaRegCatSeleccionado}"
                                                 onstart="PF('statusDialog').hide()">
                                    <f:setPropertyActionListener value="#{elemCat}"
                                                                 target="#{catGestionEscolarBean.catComunDTOGenerico}" />
                                </p:commandButton>
                                <p:tooltip for="editarPeriodo" value="#{sistema.obtenerTexto('gw.admin.vercat.texto.editar')}" position="top" />
                            </p:column>
                        </p:dataTable>
                    </p:panel>

                </div>

            </div>
        </h:form>
    </ui:define>
</ui:composition>
