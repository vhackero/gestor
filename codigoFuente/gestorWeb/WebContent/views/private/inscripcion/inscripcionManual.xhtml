<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="breadcrumb">
		<li>Gestión de inscripción</li>
		<li class="active">Inscripción manual</li>
	</ui:define>

	<ui:define name="content">

		<h:form id="mainForm">
			<p:ajaxStatus onstart="PF('dialogLayout').show()"
				onsuccess="PF('dialogLayout').hide()" />

			<h1>
				<p:outputLabel styleClass="h1" value="Inscripción manual" />
			</h1>

			<p:panel header="Inscripción" styleClass="fondoPrimario mt-2">
				<div class="row flex-bottom">
					<div class="col-md-4">
						<div class="form-group mb-0">
							<h:outputLabel for="matricula" styleClass="requerido"
								value="Matrícula" />
							<p:inputText id="matricula" placeholder="Usuario" required="true"
								requiredMessage="La matrícula es obligatoria" maxlength="100"
								value="#{inscripcionManualBean.matriculaIngresada}"
								styleClass="form-control" />
						</div>
						<p:message for="matricula" display="text" />
					</div>
					<div class="col-md-8 text-right">
						<p:commandButton id="btnBuscar" process="@this matricula" validateClient="true"
							value="Buscar" update="@form :pnlMensaje" ajax="true"
							action="#{inscripcionManualBean.buscarInscripcionDesdeMatricula}"
							styleClass="btn btn-primary" />
					</div>

				</div>
			</p:panel>

			<p:outputPanel styleClass="mt-2"
				rendered="#{inscripcionManualBean.mostrarAviso}">
				<div class="alert alert-#{inscripcionManualBean.tipoAviso}"
					role="alert">#{inscripcionManualBean.textoAviso}</div>
			</p:outputPanel>


			<p:panel header="Inscripción"
				rendered="#{inscripcionManualBean.contextoInscripcion != null}">
				<div class="row flexCentrarXY" style="align-items: flex-end">
					<div class="col-md-3 col-xs-12">
						<h:outputLabel value="Plan" styleClass="bloque" />
						<h:outputText
							value="#{inscripcionManualBean.contextoInscripcion.inscripcionPersona.plan}" />
					</div>

					<div class="col-md-6 col-xs-12">
						<h:outputLabel value="Matricula" styleClass="bloque" />
						<h:outputText
							value="#{inscripcionManualBean.contextoInscripcion.inscripcionPersona.nombreUsuario}" />
					</div>
				</div>

				<p:outputPanel styleClass="mt-2"
					rendered="#{not empty inscripcionManualBean.contextoInscripcion.mensajeSeriacion}">
					<div class="alert alert-info mb-0" role="alert">#{inscripcionManualBean.contextoInscripcion.mensajeSeriacion}</div>
				</p:outputPanel>

				<p:outputPanel styleClass="mt-2"
					rendered="#{not empty inscripcionManualBean.contextoInscripcion.mensajeLimiteReprobacionesAlcanzado}">
					<div class="alert alert-info mb-0" role="alert">#{inscripcionManualBean.contextoInscripcion.mensajeLimiteReprobacionesAlcanzado}</div>
				</p:outputPanel>

				<div class="form-group mt-1">
					<div class="row">
						<div class="col-md-12">

							<p:dataTable id="tblEditaComp"
								value="#{inscripcionManualBean.contextoInscripcion.estadoAcademico.materiasDisponibles}"
								tableStyleClass="table" var="inscripcion" paginator="false"
								emptyMessage="No hay materias disponibles para inscribir">

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="Curso/Asignatura" />
									</f:facet>
									<h:outputText value="#{inscripcion.nombreTentativoPrograma}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="Tipo de asignatura" />
									</f:facet>
									<h:outputText value="#{inscripcion.tipoPrograma}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="Semestre" />
									</f:facet>
									<h:outputText value="#{inscripcion.estructura}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="Bloque" />
									</f:facet>
									<h:outputText value="#{inscripcion.subestructura}" />
								</p:column>

								<p:column headerText="Seleccionar" styleClass="text-center">
									<p:selectBooleanCheckbox disabled="#{inscripcion.disabled}"
										value="#{inscripcion.check}" styleClass="cursor-pointer">
										<p:ajax
											listener="#{inscripcionManualBean.validarSeleccionMateria(inscripcion)}"
											event="change" update="@this :pnlMensaje" />
									</p:selectBooleanCheckbox>
								</p:column>

							</p:dataTable>

						</div>
					</div>
				</div>

				<!-- Sección de términos y condiciones controlada por mostrarTerminosCondiciones -->
				<h:panelGroup
					rendered="#{inscripcionManualBean.contextoInscripcion.terminosCondiciones.mostrarTerminosCondiciones}">
					<div class="row" style="text-align: center; margin-top: 20px;">
						<p:selectBooleanCheckbox id="chkTerminos"
							value="#{inscripcionManualBean.aceptaTerminos}">
							<p:ajax event="change" update="panelFinalizar" process="@this" />
						</p:selectBooleanCheckbox>
						<h:outputText value=" Acepto los " />
						<h:outputLink styleClass="terminos-condiciones"
							value="#{inscripcionManualBean.contextoInscripcion.terminosCondiciones.enlaceTerminosCondiciones}"
							target="_blank">términos y condiciones</h:outputLink>
					</div>
				</h:panelGroup>

				<p:outputPanel id="panelFinalizar" styleClass="text-center mt-2">
					<p:commandButton id="finalizarBtn"
						disabled="#{inscripcionManualBean.contextoInscripcion.terminosCondiciones.mostrarTerminosCondiciones and not inscripcionManualBean.aceptaTerminos}"
						value="Finalizar inscripción" update="@form :pnlMensaje"
						action="#{inscripcionManualBean.finalizarInscripcion}"
						styleClass="btn btn-primary" />
				</p:outputPanel>

			</p:panel>
		</h:form>

		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgValidarSeleccion" header="Informativo" dynamic="true">
			<p:outputPanel id="pnlMensaje">
				<div class="form-group">
					<div class="row">
						<div class="col-md-12">
							<h:outputText styleClass="bloque"
								value="#{inscripcionManualBean.mensajeDialog}" />
						</div>
					</div>
				</div>

				<div class="row">
					<div class="col-md-12 text-right">
						<p:commandButton value="Cerrar" styleClass="btn btn-default"
							onclick="PF('dlgValidarSeleccion').hide()" />
					</div>
				</div>
			</p:outputPanel>
		</p:dialog>

	</ui:define>




</ui:composition>
