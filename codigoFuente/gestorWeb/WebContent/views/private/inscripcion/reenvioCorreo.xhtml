<?xml version="1.0" encoding="UTF-8"  ?>
<!DOCTYPE html>
<ui:composition template="/templates/layout.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:sec="http://www.springframework.org/security/tags">
	<ui:define name="breadcrumb">
		<li>#{sistema.obtenerTexto('gw.reenvioCorreo.breadcrumb.anterior')}</li>
		<li class="active">#{sistema.obtenerTexto('gw.reenvioCorreo.breadcrumb.activo')}</li>
	</ui:define>
	<ui:define name="content">
		<h1>#{sistema.obtenerTexto('gw.reenvioCorreo.titulo')}</h1>
		<hr />
		<p:ajaxStatus onstart="PF('dialogLayout').show()"
			onsuccess="PF('dialogLayout').hide()" />

		<h:form id="frmBusqueda">
			<p:outputPanel rendered="#{reenvioCorreoBean.panelActivo == 1}">
				<div class="row">
					<div class="col-md-12">
						<p:panel header="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.titulo')}"
							styleClass="fondoPrimario">
							<div class="row">
								<div class="col-md-4">
									<div class="form-group">
										<h:outputLabel for="idUsuario" value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.matricula')}" />
										<p:inputText id="idUsuario" placeholder="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.matricula')}"
											value="#{reenvioCorreoBean.filtroBusqueda.matricula}"
											styleClass="form-control" />
									</div>
								</div>
							</div>
							<div class="row">
								<div class="col-md-4">
									<div class="form-group">
										<h:outputLabel styleClass="requerido" for="idConvocatoria"
											value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.convocatoria')}" />
										<p:selectOneMenu id="idConvocatoria"
											value="#{reenvioCorreoBean.filtroBusqueda.idConvocatoria}"
											class="col-xs-12">
											<f:selectItem
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems value="#{reenvioCorreoBean.convocatorias}"
												var="convocatoria" itemValue="#{convocatoria.id}"
												itemLabel="#{convocatoria.nombre}" />
											<p:ajax event="change"
												process="@this idCatProcesoInscripcion idUsuario"
												update="@form"
												listener="#{reenvioCorreoBean.onConvocatoriaChange}" />
										</p:selectOneMenu>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<h:outputLabel styleClass="requerido"
											for="idCatProcesoInscripcion" value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.tipoProceso')}" />
										<p:selectOneMenu id="idCatProcesoInscripcion"
											value="#{reenvioCorreoBean.filtroBusqueda.idTipoProceso}"
											class="col-xs-12">
											<f:selectItem
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems
												value="#{reenvioCorreoBean.tiposProcesoInscripcion}"
												var="tipoProceso" itemValue="#{tipoProceso.id}"
												itemLabel="#{tipoProceso.nombre}" />
											<p:ajax event="change"
												process="@this idConvocatoria idUsuario" update="@form"
												listener="#{reenvioCorreoBean.onTipoProcesoChange}" />
										</p:selectOneMenu>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<h:outputLabel styleClass="requerido"
											for="idProcesoInscripcion" value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.procesoInscripcion')}" />
										<p:selectOneMenu id="idProcesoInscripcion"
											disabled="#{reenvioCorreoBean.filtroBusqueda.idConvocatoria == null or reenvioCorreoBean.filtroBusqueda.idTipoProceso == null}"
											value="#{reenvioCorreoBean.filtroBusqueda.idProcesoInscripcion}"
											class="col-xs-12">
											<f:selectItem
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems
												value="#{reenvioCorreoBean.procesosInscripcion}"
												var="procesoInscripcion"
												itemValue="#{procesoInscripcion.id}"
												itemLabel="#{procesoInscripcion.nombre}" />
											<p:ajax event="change"
												listener="#{reenvioCorreoBean.onProcesoInscripcionChange}"
												update="@form" />
										</p:selectOneMenu>
									</div>
								</div>
							</div>
							<div class="row mt-1">
								<div class="col-md-4">
									<div class="form-group">
										<h:outputLabel for="idPlan" value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.plan')}" />
										<p:selectOneMenu id="idPlan"
											disabled="#{reenvioCorreoBean.filtroBusqueda.idProcesoInscripcion == null}"
											value="#{reenvioCorreoBean.filtroBusqueda.idPlan}"
											class="col-xs-12">
											<f:selectItem
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems value="#{reenvioCorreoBean.planes}" var="plan"
												itemValue="#{plan.idPlan}" itemLabel="#{plan.nombrePlan}" />
											<p:ajax event="change"
												listener="#{reenvioCorreoBean.onPlanChange}" update="@form" />
										</p:selectOneMenu>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<h:outputLabel for="idPrograma" value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.programa')}" />
										<p:selectOneMenu id="idPrograma"
											disabled="#{reenvioCorreoBean.filtroBusqueda.idProcesoInscripcion == null or reenvioCorreoBean.filtroBusqueda.idPlan == null}"
											value="#{reenvioCorreoBean.filtroBusqueda.idPrograma}"
											class="col-xs-12">
											<f:selectItem
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems value="#{reenvioCorreoBean.programas}"
												var="programa" itemValue="#{programa.idPrograma}"
												itemLabel="#{programa.nombrePrograma}" />

										</p:selectOneMenu>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group">
										<h:outputLabel styleClass="requerido" for="estatusEnvio"
											value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.estadoEnvio')}" />
										<p:selectOneMenu id="estatusEnvio"
											disabled="#{reenvioCorreoBean.filtroBusqueda.idProcesoInscripcion == null}"
											value="#{reenvioCorreoBean.filtroBusqueda.estatusEnvio}"
											class="col-xs-12">
											<f:selectItem
												itemLabel="#{sistema.obtenerTexto('gw.textos.menu.seleccionar')}" />
											<f:selectItems
												value="#{reenvioCorreoBean.estatusEnvioCorreo}"
												var="estatus" itemValue="#{estatus.idEstatusEnvio}"
												itemLabel="#{estatus.nombreEstatusEnvio}" />
											<p:ajax event="change" update="@form" />

										</p:selectOneMenu>
									</div>
								</div>
							</div>

							<div class="row mt-2">
								<div class="col-md-12">
									<p:commandButton id="btnBuscar"
										disabled="#{reenvioCorreoBean.filtroBusqueda.estatusEnvio == null}"
										value="#{sistema.obtenerTexto('gw.bitacora.modal.personas.boton.buscar')}"
										action="#{reenvioCorreoBean.buscarUsuarios}" ajax="true"
										process="@form" update="@form frmTabla"
										styleClass="btn btn-primary pull-right" />
									<p:commandButton value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelBusqueda.boton.limpiar')}"
										action="#{reenvioCorreoBean.limpiarFiltroBusqueda}"
										ajax="true" update="@form frmTabla"
										styleClass="btn btn-default pull-right" />

								</div>
							</div>

						</p:panel>
					</div>
				</div>
			</p:outputPanel>
		</h:form>
		<h:form id="frmTabla">
			<p:outputPanel rendered="#{reenvioCorreoBean.panelActivo == 1}">
				<div class="row">
					<div class="col-md-12">
						<p:panel header="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.titulo')}"
							styleClass="fondoPrimario">
							<p:dataTable id="tblResultados"
								value="#{reenvioCorreoBean.inscripciones}"
								tableStyleClass="table" var="inscripcion" paginator="true"
								paginatorPosition="bottom"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								rowsPerPageTemplate="5,10,15" reflow="true" lazy="true"
								rows="10" emptyMessage="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.mensajeVacio')}">

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.tablaColumna.nombre')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.nombre}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.tablaColumna.primerApellido')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.primerApellido}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.tablaColumna.segundoApellido')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.segundoApellido}" />
								</p:column>

								<p:column styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.tablaColumna.matricula')}" />
									</f:facet>
									<h:outputText value="#{inscripcion.idUsuario}" />
								</p:column>

								<p:column headerText="Seleccionar" styleClass="text-center">
									<f:facet name="header">
										<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.tablaColumna.acciones')}" />
									</f:facet>
									<p:commandButton id="btnReenviarCorreo"
										oncomplete="PF('dlgMensajeConfirmacion').show()"
										styleClass="btn-icon btn btn-default icono_sisi fa fa-regular fa-envelope">
										<f:setPropertyActionListener
											target="#{reenvioCorreoBean.inscripcionSeleccionada}"
											value="#{inscripcion}" />
									</p:commandButton>
									<p:tooltip for="btnReenviarCorreo" value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.tablaColumna.tooltip1')}"
										position="top" />
									<p:commandButton id="btnVer" process="@this" ajax="true"
										update="frmMaterias frmBusqueda frmTabla"
										action="#{reenvioCorreoBean.mostrarMateriasEstudianteSeleccionado}"
										styleClass="ml-1 btn-icon btn btn-default icono_sisi fa fa-regular fa-eye">
										<f:setPropertyActionListener
											target="#{reenvioCorreoBean.inscripcionSeleccionada}"
											value="#{inscripcion}" />
									</p:commandButton>
									<p:tooltip for="btnVer" value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelResultadoBusqueda.tablaColumna.tooltip2')}" position="top" />
								</p:column>

							</p:dataTable>
						</p:panel>
					</div>
				</div>
			</p:outputPanel>
		</h:form>

		<h:form id="frmMaterias">
			<p:outputPanel rendered="#{reenvioCorreoBean.panelActivo == 2}">
				<p:panel header="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.titulo')}">
					<div class="row flexCentrarXY" style="align-items: flex-end">
						<div class="col-md-3 col-xs-12">
							<h:outputLabel value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.plan')}" styleClass="bloque" />
							<h:outputText value="#{reenvioCorreoBean.nombrePlan}" />
						</div>

						<div class="col-md-6 col-xs-12">
							<h:outputLabel value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.matricula')}" styleClass="bloque" />
							<h:outputText
								value="#{reenvioCorreoBean.inscripcionSeleccionada.idUsuario}" />
						</div>
					</div>
				</p:panel>
				<p:dataTable styleClass="mt-2"
					value="#{reenvioCorreoBean.materiasEstudianteSeleccionado}"
					tableStyleClass="table" var="inscripcion" paginator="false"
					emptyMessage="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.mensajeVacio')}">

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.tablaColumna.curso')}" />
						</f:facet>
						<h:outputText value="#{inscripcion.programa}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.tablaColumna.tipo')}" />
						</f:facet>
						<h:outputText value="#{inscripcion.tipoPrograma}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.tablaColumna.semestre')}" />
						</f:facet>
						<h:outputText value="#{inscripcion.semestre}" />
					</p:column>

					<p:column styleClass="text-center">
						<f:facet name="header">
							<h:outputText value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.tablaColumna.bloque')}" />
						</f:facet>
						<h:outputText value="#{inscripcion.bloque}" />
					</p:column>

				</p:dataTable>
				<p:outputPanel styleClass="text-center mt-2">
					<p:commandButton value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.boton.cancelar')}" process="@this"
						update="frmMaterias frmBusqueda frmTabla"
						action="#{reenvioCorreoBean.mostrarPanelBusquedaInscripcion}"
						styleClass="btn btn-default" />
					<p:commandButton value="#{sistema.obtenerTexto('gw.reenvioCorreo.panelMaterias.boton.reenviarCorreo')}"
						onclick="PF('dlgMensajeConfirmacion').show()"
						styleClass="btn btn-primary ml-1" />
				</p:outputPanel>
			</p:outputPanel>
		</h:form>

		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgMensajeConfirmacion" header="#{sistema.obtenerTexto('gw.reenvioCorreo.modalConfirmacion.titulo')}"
			dynamic="true">
			<h:form id="frmConfirmacion">
				<p:outputPanel>
					<div class="form-group">
						<div class="row">
							<div class="col-md-12">
								<h:outputText styleClass="bloque"
									value="#{sistema.obtenerTexto('gw.reenvioCorreo.modalConfirmacion.mensaje')}" />
							</div>
						</div>
					</div>
					<div class="row">
						<div class="col-md-12 text-right">
							<p:commandButton value="#{sistema.obtenerTexto('gw.reenvioCorreo.modalConfirmacion.boton.aceptar')}"
								action="#{reenvioCorreoBean.reenviarCorreoInscripcion}"
								ajax="true" process="@this" update=":pnlMensaje"
								oncomplete="PF('dlgMensajeConfirmacion').hide()"
								styleClass="btn btn-primary pull-right" />
							<p:commandButton value="#{sistema.obtenerTexto('gw.reenvioCorreo.modalConfirmacion.boton.cancelar')}" styleClass="btn btn-default"
								onclick="PF('dlgMensajeConfirmacion').hide()" />
						</div>
					</div>
				</p:outputPanel>
			</h:form>
		</p:dialog>

		<p:dialog appendTo="@(body)" draggable="false" position="center"
			resizable="false" closable="false" modal="true" width="600px"
			widgetVar="dlgMensaje" header="#{sistema.obtenerTexto('gw.reenvioCorreo.modalInformativo.titulo')}" dynamic="true">
			<p:outputPanel id="pnlMensaje">
				<div class="form-group">
					<div class="row">
						<div class="col-md-12">
							<h:outputText styleClass="bloque"
								value="#{reenvioCorreoBean.mensajeDialog}" />
						</div>
					</div>
				</div>
				<div class="row">
					<div class="col-md-12 text-right">
						<p:commandButton value="#{sistema.obtenerTexto('gw.reenvioCorreo.modalInformativo.boton.cerrar')}" styleClass="btn btn-default"
							onclick="PF('dlgMensaje').hide()" />
					</div>
				</div>
			</p:outputPanel>
		</p:dialog>
	</ui:define>
</ui:composition>
